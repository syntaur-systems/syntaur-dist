name: Workflow lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-workflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify exact change scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=
          case "$EVENT_NAME" in
            pull_request)
              base=$PR_BASE_SHA
              ;;
            push)
              if [[ $PUSH_BEFORE_SHA =~ ^[1-9a-f][0-9a-f]{39}$ ]]; then
                base=$PUSH_BEFORE_SHA
              elif git show-ref --verify --quiet refs/remotes/origin/main; then
                base=$(git merge-base "$GITHUB_SHA" refs/remotes/origin/main)
              fi
              ;;
          esac
          scope=full
          if [[ $base =~ ^[0-9a-f]{40}$ ]]; then
            scope=$(bash scripts/classify-workflow-change.sh "$base" "$GITHUB_SHA")
          fi
          printf 'scope=%s\n' "$scope" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install pinned workflow validators
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/mikefarah/yq/v4@v4.47.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate release workflow and embedded Bash
        run: bash scripts/validate-release-workflow.sh

      - name: Verify strict release-authority schema transitions
        if: steps.scope.outputs.scope != 'installer-only'
        run: bash scripts/test-release-authority-workflow.sh

      - name: Verify V2 genesis bootstrap behavior
        if: steps.scope.outputs.scope != 'installer-only'
        run: bash scripts/test-release-authority-bootstrap.sh

      - name: Verify POSIX EULA acceptance reuse
        run: bash scripts/test-eula-acceptance.sh

      - name: Verify privileged process inspector installation
        run: bash scripts/test-process-inspector-install-container.sh

  windows-eula:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Windows EULA acceptance reuse
        shell: powershell
        run: .\scripts\test-eula-acceptance.ps1
