name: Freeze or promote release authority

# The only genesis is an independently approved V2 generation 1 when the
# authority namespace is empty. Every later run is an exact N+1 successor.
# Signing and publishing use separate jobs and disjoint token authority.
on:
  workflow_dispatch:
    inputs:
      approval_record:
        description: Exact canonical one-line reviewed authority approval JSON
        required: true
      resolution_revision:
        description: Immutable replacement-resolution revision (1 for the original)
        required: false
        default: '1'

permissions: {}

concurrency:
  group: syntaur-release-authority
  cancel-in-progress: false

env:
  AUTHORITY_BUILDER_IMAGE: rust@sha256:4ec71e955e6c08aeb238885083222ddff79d82eb87654a96c76e38e94da1a53b
  DEBIAN_SNAPSHOT: '20260727T000000Z'
  AGE_VERSION: v1.3.1
  AGE_LINUX_AMD64_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
  YQ_VERSION: v4.53.2
  YQ_LINUX_AMD64_SHA256: d56bf5c6819e8e696340c312bd70f849dc1678a7cda9c2ad63eebd906371d56b
  SOURCE_ARCHIVE_AGE_RECIPIENT: age1dwqp988m67hhup4vvsgjqq03rjysn7zkv2yn988lea6pk5w2t90qdt4x3t

jobs:
  predecessor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    outputs:
      generation: ${{ steps.predecessor.outputs.generation }}
      previous_generation: ${{ steps.predecessor.outputs.previous_generation }}
      previous_manifest_sha256: ${{ steps.predecessor.outputs.previous_manifest_sha256 }}
      previous_schema: ${{ steps.predecessor.outputs.previous_schema }}
      previous_workflow_commit: ${{ steps.predecessor.outputs.previous_workflow_commit }}
      target_tag: ${{ steps.predecessor.outputs.target_tag }}
      replacement: ${{ steps.predecessor.outputs.replacement }}
      target_already_published: ${{ steps.predecessor.outputs.target_already_published }}
      already_published: ${{ steps.predecessor.outputs.already_published }}
      genesis: ${{ steps.predecessor.outputs.genesis }}
    steps:
      - name: Checkout exact public verification helpers
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Validate exact reviewed inputs
        shell: bash
        env:
          APPROVAL_RECORD: ${{ inputs.approval_record }}
          PREVIOUS_GENERATION: ${{ fromJSON(inputs.approval_record).previous_generation }}
          PREVIOUS_MANIFEST_SHA256: ${{ fromJSON(inputs.approval_record).previous_manifest_sha256 }}
          AUTHORITY_VERSION: ${{ fromJSON(inputs.approval_record).authority_version }}
          AUTHORITY_COMMIT: ${{ fromJSON(inputs.approval_record).authority_commit }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
          AUTHORITY_TREE_SHA256: ${{ fromJSON(inputs.approval_record).authority_tree_sha256 }}
          SHIPPER_SHA256: ${{ fromJSON(inputs.approval_record).shipper_sha256 }}
          VERIFIER_SHA256: ${{ fromJSON(inputs.approval_record).verifier_sha256 }}
          BASELINE_PROFILE: ${{ fromJSON(inputs.approval_record).baseline_profile }}
          BASELINE_GENERATION: ${{ fromJSON(inputs.approval_record).baseline_generation }}
          BASELINE_TREE_SHA256: ${{ fromJSON(inputs.approval_record).baseline_tree_sha256 }}
          BROWSER_BUNDLE_SHA256: ${{ fromJSON(inputs.approval_record).browser_bundle_sha256 }}
          BROWSER_VERSION: ${{ fromJSON(inputs.approval_record).browser_version }}
          BROWSER_LAUNCH_PROFILE_SHA256: ${{ fromJSON(inputs.approval_record).browser_launch_profile_sha256 }}
          VERIFIER_SCHEMA: ${{ fromJSON(inputs.approval_record).verifier_schema }}
          PROVISIONER_SHA256: ${{ fromJSON(inputs.approval_record).provisioner_sha256 }}
          PRODUCTION_CONTRACT_SHA256: ${{ fromJSON(inputs.approval_record).production_contract_sha256 }}
          PRODUCTION_MEMBER_COUNT: ${{ fromJSON(inputs.approval_record).production_member_count }}
          RECEIPT_SCHEMA: ${{ fromJSON(inputs.approval_record).receipt_schema }}
          BUILD_AUTHORITY_SCHEMA: ${{ fromJSON(inputs.approval_record).build_authority_schema }}
          PROMOTION_RECOVERY_SCHEMA: ${{ fromJSON(inputs.approval_record).promotion_recovery_schema }}
          RESOLUTION_REVISION: ${{ inputs.resolution_revision }}
          PROMOTION_RECOVERY_SHA256: ${{ fromJSON(inputs.approval_record).promotion_recovery_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPROVAL_RECORD" >"$RUNNER_TEMP/approval-record.json"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-approval-record "$RUNNER_TEMP/approval-record.json"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$PREVIOUS_GENERATION" | grep -Eq '^(0|[1-9][0-9]{0,15})$'
          test "$PREVIOUS_GENERATION" -lt 9007199254740991
          printf '%s' "$AUTHORITY_VERSION" \
            | grep -Eq '^(0|[1-9][0-9]{0,9})\.(0|[1-9][0-9]{0,9})\.(0|[1-9][0-9]{0,9})$'
          printf '%s' "$AUTHORITY_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$VERIFICATION_POLICY_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          if [[ $PREVIOUS_GENERATION == 0 ]]; then
            test "$VERIFICATION_POLICY_REVISION" = "$AUTHORITY_COMMIT"
          else
            test "$VERIFICATION_POLICY_REVISION" != "$AUTHORITY_COMMIT"
          fi
          for digest in \
            "$PREVIOUS_MANIFEST_SHA256" \
            "$AUTHORITY_TREE_SHA256" \
            "$SHIPPER_SHA256" \
            "$VERIFIER_SHA256" \
            "$BASELINE_TREE_SHA256" \
            "$BROWSER_BUNDLE_SHA256" \
            "$BROWSER_LAUNCH_PROFILE_SHA256" \
            "$PROVISIONER_SHA256" \
            "$PRODUCTION_CONTRACT_SHA256" \
            "$PROMOTION_RECOVERY_SHA256"; do
            printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          done
          zero_digest=$(printf '0%.0s' {1..64})
          if [[ $PREVIOUS_GENERATION == 0 ]]; then
            test "$PREVIOUS_MANIFEST_SHA256" = "$zero_digest"
          else
            test "$PREVIOUS_MANIFEST_SHA256" != "$zero_digest"
          fi
          for value in \
            "$BASELINE_PROFILE" \
            "$BASELINE_GENERATION" \
            "$BROWSER_VERSION"; do
            test -n "$value"
            test "${#value}" -le 256
            test "$(printf '%s' "$value" | wc -l)" -eq 0
          done
          printf '%s' "$BASELINE_PROFILE" | grep -Eq '^[A-Za-z0-9._-]+$'
          printf '%s' "$BASELINE_GENERATION" | grep -Eq '^[A-Za-z0-9._-]+$'
          printf '%s' "$BROWSER_VERSION" \
            | grep -Eq '^Google Chrome for Testing [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s' "$VERIFIER_SCHEMA" | grep -Eq '^[1-9][0-9]{0,8}$'
          test "$PRODUCTION_MEMBER_COUNT" = 12
          test "$RECEIPT_SCHEMA" = 6
          test "$BUILD_AUTHORITY_SCHEMA" = 4
          test "$PROMOTION_RECOVERY_SCHEMA" = 1
          printf '%s' "$RESOLUTION_REVISION" | grep -Eq '^[1-9][0-9]{0,15}$'
          test "$RESOLUTION_REVISION" -le 9007199254740991

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Verify immutable predecessor and choose exact successor
        id: predecessor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
          EXPECTED_PREVIOUS_GENERATION: ${{ fromJSON(inputs.approval_record).previous_generation }}
          EXPECTED_PREVIOUS_MANIFEST_SHA256: ${{ fromJSON(inputs.approval_record).previous_manifest_sha256 }}
        run: |
          set -euo pipefail
          api_optional() {
            local endpoint=$1
            local output=$2
            local error_file=$3
            if gh api "$endpoint" >"$output" 2>"$error_file"; then
              printf 'present\n'
              return
            fi
            if grep -Eq '\(HTTP 404\)$' "$error_file"; then
              : >"$output"
              printf 'absent\n'
              return
            fi
            cat "$error_file" >&2
            return 1
          }
          release_by_tag() {
            local inventory=$1
            local tag=$2
            local output=$3
            local matches count
            matches=$(mktemp "$RUNNER_TEMP/release-by-tag.XXXXXX") \
              || return 1
            jq -c --arg tag "$tag" \
              'select(.tag_name == $tag)' "$inventory" >"$matches" \
              || return 1
            count=$(jq -s 'length' "$matches") || return 1
            if (( count > 1 )); then
              printf 'duplicate release records for tag %s\n' "$tag" >&2
              return 1
            fi
            if [[ $count == 0 ]]; then
              : >"$output" || return 1
              printf 'absent\n'
            else
              jq -s '.[0]' "$matches" >"$output" || return 1
              printf 'present\n'
            fi
          }

          release_tags=$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | .tag_name |
              select(startswith("authority-v1-g"))')
          ref_tags=$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/authority-v1-g" \
            --jq '.[].ref | sub("^refs/tags/"; "")')
          namespace_tags=$(printf '%s\n%s\n' "$release_tags" "$ref_tags" \
            | sed '/^$/d' | LC_ALL=C sort -u)
          while IFS= read -r authority_tag; do
            [[ -z $authority_tag ]] && continue
            printf '%s' "$authority_tag" \
              | grep -Eq '^authority-v1-g[1-9][0-9]*$'
          done <<<"$namespace_tags"
          namespace_generations=$(sed -nE \
            's/^authority-v1-g([1-9][0-9]*)$/\1/p' <<<"$namespace_tags")
          immutable_generations=$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] |
              select(.draft == false and .prerelease == false and .immutable == true) |
              .tag_name' \
            | sed -nE 's/^authority-v1-g([1-9][0-9]*)$/\1/p')
          generation=$((EXPECTED_PREVIOUS_GENERATION + 1))
          test "$generation" -le 9007199254740991
          previous=$EXPECTED_PREVIOUS_GENERATION
          previous_schema=0
          previous_workflow_commit=
          previous_manifest_sha256=$EXPECTED_PREVIOUS_MANIFEST_SHA256
          genesis=false
          replacement=$(jq -r '.schema == 2' "$RUNNER_TEMP/approval-record.json")
          target_tag="authority-v1-g${generation}"
          target_already_published=false

          special_namespace_max=$previous
          if [[ $replacement == true ]]; then
            special_namespace_max=$generation
          fi
          resolution_release_names=
          for special_prefix in \
            authority-replacement-v1-g \
            authority-resolution-v1-g; do
            release_names="$RUNNER_TEMP/${special_prefix}release-tags"
            published_release_names="$RUNNER_TEMP/${special_prefix}published-release-tags"
            ref_names="$RUNNER_TEMP/${special_prefix}ref-tags"
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | .tag_name | select(startswith(\"${special_prefix}\"))" \
              >"$release_names"
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.draft == false) | .tag_name |
                select(startswith(\"${special_prefix}\"))" \
              >"$published_release_names"
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${special_prefix}" \
              --jq '.[].ref | sub("^refs/tags/"; "")' >"$ref_names"
            bash public-workflow/scripts/release-authority-manifest.sh \
              validate-special-tag-namespace \
              "$special_prefix" "$special_namespace_max" "$release_names"
            bash public-workflow/scripts/release-authority-manifest.sh \
              validate-special-tag-namespace \
              "$special_prefix" "$special_namespace_max" "$ref_names"
            cmp <(LC_ALL=C sort -u "$published_release_names") \
              <(LC_ALL=C sort -u "$ref_names")
            if [[ $special_prefix == authority-resolution-v1-g ]]; then
              resolution_release_names=$published_release_names
            fi
          done
          test -n "$resolution_release_names"

          if [[ $previous == 0 ]]; then
            test "$generation" = 1
            if [[ -n $namespace_generations ]]; then
              test -z "$(grep -vx '1' <<<"$namespace_generations" || true)"
            fi
            genesis=true
          else
            test -n "$immutable_generations"
            latest_immutable=$(printf '%s\n' "$immutable_generations" \
              | sort -n | sed -n '$p')
            test "$latest_immutable" = "$previous" \
              || test "$latest_immutable" = "$generation"
            test -n "$namespace_generations"
            latest_namespace=$(printf '%s\n' "$namespace_generations" \
              | sort -n | sed -n '$p')
            test "$latest_namespace" = "$previous" \
              || test "$latest_namespace" = "$generation"
            previous_tag="authority-v1-g${previous}"
            resolved_replacement=false
            resolution_tag="authority-resolution-v1-g${previous}"
            previous_resolution_tags=$(grep -E \
              "^authority-resolution-v1-g${previous}(-r([2-9]|[1-9][0-9]+))?$" \
              "$resolution_release_names" || true)
            if [[ -n $previous_resolution_tags ]]; then
              resolution_tag=$(printf '%s\n' "$previous_resolution_tags" \
                | LC_ALL=C sort -V | sed -n '$p')
            fi
            resolution_tag_file="$RUNNER_TEMP/previous-resolution-tag.json"
            resolution_tag_error="$RUNNER_TEMP/previous-resolution-tag.error"
            resolution_release_file="$RUNNER_TEMP/previous-resolution-release.json"
            resolution_release_error="$RUNNER_TEMP/previous-resolution-release.error"
            resolution_tag_status=$(api_optional \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${resolution_tag}" \
              "$resolution_tag_file" "$resolution_tag_error")
            resolution_release_status=$(api_optional \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/${resolution_tag}" \
              "$resolution_release_file" "$resolution_release_error")
            test "$resolution_tag_status" = "$resolution_release_status"
            if [[ $resolution_release_status == present ]]; then
              resolution_release=$(<"$resolution_release_file")
              test "$(jq -r '.draft' <<<"$resolution_release")" = false
              test "$(jq -r '.prerelease' <<<"$resolution_release")" = false
              test "$(jq -r '.immutable' <<<"$resolution_release")" = true
              test "$(jq -r '.object.type' "$resolution_tag_file")" = commit
              resolution_workflow_commit=$(jq -r '.object.sha' "$resolution_tag_file")
              printf '%s' "$resolution_workflow_commit" | grep -Eq '^[0-9a-f]{40}$'
              resolution_dir="$RUNNER_TEMP/previous-resolution"
              mkdir -m 0700 "$resolution_dir"
              gh release download "$resolution_tag" \
                --repo "$GITHUB_REPOSITORY" --dir "$resolution_dir"
              gh release verify "$resolution_tag" \
                --repo "$GITHUB_REPOSITORY" >/dev/null
              while IFS= read -r asset; do
                gh release verify-asset "$resolution_tag" "$resolution_dir/$asset" \
                  --repo "$GITHUB_REPOSITORY" >/dev/null
              done < <(jq -r '.assets[].name' <<<"$resolution_release")
              bash public-workflow/scripts/release-authority-manifest.sh \
                validate-replacement-resolution-assets "$resolution_dir"
              resolution_record="$resolution_dir/release-authority-replacement-v1.json"
              bash public-workflow/scripts/release-authority-manifest.sh \
                validate-replacement-resolution-tag \
                "$resolution_tag" "$resolution_record"
              test "$(jq -er '.selected_generation' "$resolution_record")" = "$previous"
              test "$(jq -er '.selected_manifest_sha256' "$resolution_record")" \
                = "$EXPECTED_PREVIOUS_MANIFEST_SHA256"
              test "$(jq -er '.selected_workflow_commit' "$resolution_record")" \
                != ""
              test "$(jq -er '.resolution_workflow_commit' "$resolution_record")" \
                = "$resolution_workflow_commit"
              test "$(jq -er '.predecessor_generation' "$resolution_record")" \
                = "$((previous - 1))"
              previous_tag=$(jq -er '.selected_tag' "$resolution_record")
              test "$previous_tag" = "authority-replacement-v1-g${previous}"
              resolved_replacement=true
              cosign verify-blob \
                --bundle "$resolution_dir/release-authority-replacement-v1.json.cosign.bundle" \
                --certificate-identity \
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                --certificate-github-workflow-sha "$resolution_workflow_commit" \
                "$resolution_record"
            fi
            previous_release=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/${previous_tag}")
            test "$(jq -r '.draft' <<<"$previous_release")" = false
            test "$(jq -r '.prerelease' <<<"$previous_release")" = false
            test "$(jq -r '.immutable' <<<"$previous_release")" = true
            test "$(gh api \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${previous_tag}" \
              --jq '.object.type')" = commit
            previous_workflow_commit=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${previous_tag}" \
              --jq '.object.sha')
            printf '%s' "$previous_workflow_commit" | grep -Eq '^[0-9a-f]{40}$'

            previous_dir="$RUNNER_TEMP/previous-authority"
            mkdir -m 0700 "$previous_dir"
            jq -r '.assets[].name' <<<"$previous_release" \
              >"$RUNNER_TEMP/previous-authority-assets.txt"
            previous_schema=$(bash \
              public-workflow/scripts/release-authority-manifest.sh \
              asset-schema "$RUNNER_TEMP/previous-authority-assets.txt")
            gh release download "$previous_tag" \
              --repo "$GITHUB_REPOSITORY" --dir "$previous_dir"
            find "$previous_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              >"$RUNNER_TEMP/downloaded-authority-assets.txt"
            test "$(bash public-workflow/scripts/release-authority-manifest.sh \
              asset-schema "$RUNNER_TEMP/downloaded-authority-assets.txt")" \
              = "$previous_schema"
            gh release verify "$previous_tag" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
            while IFS= read -r asset; do
              gh release verify-asset \
                "$previous_tag" "$previous_dir/$asset" \
                --repo "$GITHUB_REPOSITORY" >/dev/null
            done <"$RUNNER_TEMP/previous-authority-assets.txt"
            previous_manifest="$previous_dir/release-authority-v${previous_schema}.json"
            previous_bundle="${previous_manifest}.cosign.bundle"
            bash public-workflow/scripts/release-authority-manifest.sh validate \
              "$previous_manifest" \
              "$previous_schema" \
              "$previous" \
              "$previous_workflow_commit" \
              "$previous_dir"
            if [[ $previous_schema == 1 ]]; then
              test "$previous" = 1
              test "$(jq -er '.previous_generation' "$previous_manifest")" = 0
              test "$(jq -er '.previous_manifest_sha256' "$previous_manifest")" \
                = "$(printf '0%.0s' {1..64})"
            fi
            cosign verify-blob \
              --bundle "$previous_bundle" \
              --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-sha "$previous_workflow_commit" \
              "$previous_manifest"
            previous_manifest_sha256=$(sha256sum "$previous_manifest" | awk '{print $1}')
            test "$previous_manifest_sha256" = "$EXPECTED_PREVIOUS_MANIFEST_SHA256"
            if [[ $resolved_replacement == true ]]; then
              test "$(jq -er '.selected_workflow_commit' "$resolution_record")" \
                = "$previous_workflow_commit"
              test "$(jq -er '.predecessor_generation' "$resolution_record")" \
                = "$(jq -er '.previous_generation' "$previous_manifest")"
              test "$(jq -er '.predecessor_manifest_sha256' "$resolution_record")" \
                = "$(jq -er '.previous_manifest_sha256' "$previous_manifest")"
            fi
          fi

          if [[ $replacement == true ]]; then
            test "$genesis" = false
            rejected_generation=$(jq -er '.rejected_generation' \
              "$RUNNER_TEMP/approval-record.json")
            test "$rejected_generation" = "$generation"
            rejected_tag="authority-v1-g${rejected_generation}"
            rejected_release=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/${rejected_tag}")
            test "$(jq -r '.draft' <<<"$rejected_release")" = false
            test "$(jq -r '.prerelease' <<<"$rejected_release")" = false
            test "$(jq -r '.immutable' <<<"$rejected_release")" = true
            rejected_workflow_commit=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${rejected_tag}" \
              --jq '.object.sha')
            test "$rejected_workflow_commit" = \
              "$(jq -er '.rejected_workflow_commit' "$RUNNER_TEMP/approval-record.json")"
            rejected_dir="$RUNNER_TEMP/rejected-authority"
            mkdir -m 0700 "$rejected_dir"
            gh release download "$rejected_tag" \
              --repo "$GITHUB_REPOSITORY" --dir "$rejected_dir"
            gh release verify "$rejected_tag" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
            while IFS= read -r asset; do
              gh release verify-asset "$rejected_tag" "$rejected_dir/$asset" \
                --repo "$GITHUB_REPOSITORY" >/dev/null
            done < <(jq -r '.assets[].name' <<<"$rejected_release")
            jq -r '.assets[].name' <<<"$rejected_release" \
              >"$RUNNER_TEMP/rejected-authority-assets.txt"
            test "$(bash public-workflow/scripts/release-authority-manifest.sh \
              asset-schema "$RUNNER_TEMP/rejected-authority-assets.txt")" = 2
            rejected_manifest="$rejected_dir/release-authority-v2.json"
            bash public-workflow/scripts/release-authority-manifest.sh validate \
              "$rejected_manifest" 2 "$rejected_generation" \
              "$rejected_workflow_commit" "$rejected_dir"
            bash public-workflow/scripts/release-authority-manifest.sh \
              assert-successor "$previous_manifest" "$rejected_manifest"
            rejected_manifest_sha256=$(sha256sum "$rejected_manifest" | awk '{print $1}')
            test "$rejected_manifest_sha256" = \
              "$(jq -er '.rejected_manifest_sha256' "$RUNNER_TEMP/approval-record.json")"
            test "$(jq -er '.authority_version' "$rejected_manifest")" = \
              "$(jq -er '.rejected_authority_version' "$RUNNER_TEMP/approval-record.json")"
            test "$(jq -er '.authority_commit' "$rejected_manifest")" = \
              "$(jq -er '.rejected_authority_commit' "$RUNNER_TEMP/approval-record.json")"
            cosign verify-blob \
              --bundle "$rejected_dir/release-authority-v2.json.cosign.bundle" \
              --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-sha "$rejected_workflow_commit" \
              "$rejected_manifest"

            rejected_version=$(jq -er '.rejected_authority_version' \
              "$RUNNER_TEMP/approval-record.json")
            rejected_product_commit=$(jq -er '.rejected_product_release_commit' \
              "$RUNNER_TEMP/approval-record.json")
            rejected_product_release=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/v${rejected_version}")
            test "$(jq -r '.draft' <<<"$rejected_product_release")" = false
            test "$(jq -r '.prerelease' <<<"$rejected_product_release")" = false
            test "$(jq -r '.immutable' <<<"$rejected_product_release")" = true
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/v${rejected_version}" \
              --jq '.object.type')" = commit
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/v${rejected_version}" \
              --jq '.object.sha')" = "$rejected_product_commit"
            test "$rejected_product_commit" != \
              "$(jq -er '.rejected_authority_commit' "$RUNNER_TEMP/approval-record.json")"

            selected_version=$(jq -er '.authority_version' \
              "$RUNNER_TEMP/approval-record.json")
            selected_commit=$(jq -er '.authority_commit' \
              "$RUNNER_TEMP/approval-record.json")
            settled_version=$(jq -er '.settled_product_version' \
              "$RUNNER_TEMP/approval-record.json")
            settled_gateway_commit=$(jq -er '.settled_product_gateway_commit' \
              "$RUNNER_TEMP/approval-record.json")
            settled_engine_commit=$(jq -er '.settled_product_engine_commit' \
              "$RUNNER_TEMP/approval-record.json")
            selected_engine_commit=$(jq -er '.selected_engine_commit' \
              "$RUNNER_TEMP/approval-record.json")
            planned_product_version=$(jq -er '.planned_product_version' \
              "$RUNNER_TEMP/approval-record.json")
            planned_product_base_commit=$(jq -er '.planned_product_base_commit' \
              "$RUNNER_TEMP/approval-record.json")
            test "$settled_version" = "$selected_version"
            test "$settled_gateway_commit" != "$selected_commit"
            test "$planned_product_base_commit" = "$selected_commit"
            test -n "$planned_product_version"
            printf '%s\n%s\n' "$settled_engine_commit" "$selected_engine_commit" \
              | grep -Eq '^[0-9a-f]{40}$'
            settled_product_release=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/v${settled_version}")
            test "$(jq -r '.draft' <<<"$settled_product_release")" = false
            test "$(jq -r '.prerelease' <<<"$settled_product_release")" = false
            test "$(jq -r '.immutable' <<<"$settled_product_release")" = true
            settled_tag_ref=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/v${settled_version}")
            test "$(jq -r '.object.type' <<<"$settled_tag_ref")" = commit
            settled_dist_commit=$(jq -er '.object.sha' <<<"$settled_tag_ref")
            printf '%s' "$settled_dist_commit" | grep -Eq '^[0-9a-f]{40}$'
            test "$(jq -r '.target_commitish' <<<"$settled_product_release")" \
              = "$settled_dist_commit"

            settled_proof_dir=$(mktemp -d \
              "$RUNNER_TEMP/settled-product-provenance.XXXXXX")
            settled_product_proof_assets=(
              syntaur-source-commit.txt
              syntaur-source-commit.txt.cosign.bundle
              syntaur-engine-source-commit.txt
              syntaur-engine-source-commit.txt.cosign.bundle
            )
            for asset in "${settled_product_proof_assets[@]}"; do
              asset_count=$(jq --arg asset "$asset" \
                '[.assets[] | select(.name == $asset)] | length' \
                <<<"$settled_product_release")
              test "$asset_count" = 1
              asset_size=$(jq -er --arg asset "$asset" \
                '.assets[] | select(.name == $asset) | .size' \
                <<<"$settled_product_release")
              case $asset in
                *.cosign.bundle) asset_maximum=131072 ;;
                *) asset_maximum=4096 ;;
              esac
              (( asset_size > 0 && asset_size <= asset_maximum ))
              gh release download "v${settled_version}" \
                --repo "$GITHUB_REPOSITORY" --dir "$settled_proof_dir" \
                --pattern "$asset"
              test -f "$settled_proof_dir/$asset"
              test ! -L "$settled_proof_dir/$asset"
              test "$(stat -c '%s' "$settled_proof_dir/$asset")" = "$asset_size"
              gh release verify-asset \
                "v${settled_version}" "$settled_proof_dir/$asset" \
                --repo "$GITHUB_REPOSITORY" >/dev/null
            done
            settled_proof_actual=$(find "$settled_proof_dir" \
              -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
            settled_proof_expected=$(printf '%s\n' \
              "${settled_product_proof_assets[@]}" | LC_ALL=C sort)
            test "$settled_proof_actual" = "$settled_proof_expected"
            gh release verify "v${settled_version}" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
            for proof in \
              syntaur-source-commit.txt \
              syntaur-engine-source-commit.txt; do
              cosign verify-blob \
                --bundle "$settled_proof_dir/${proof}.cosign.bundle" \
                --certificate-identity \
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-sign.yml@refs/heads/main" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                --certificate-github-workflow-sha "$settled_dist_commit" \
                "$settled_proof_dir/$proof"
            done
            bash public-workflow/scripts/release-authority-manifest.sh \
              validate-product-source-proofs \
              "$settled_proof_dir/syntaur-source-commit.txt" \
              "$settled_proof_dir/syntaur-engine-source-commit.txt" \
              "$settled_version" "$settled_gateway_commit" \
              "$settled_engine_commit"
            target_tag="authority-replacement-v1-g${generation}"
          fi

          tag=$target_tag
          tag_file="$RUNNER_TEMP/target-tag.json"
          tag_error="$RUNNER_TEMP/target-tag.error"
          tag_status=$(api_optional \
            "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            "$tag_file" "$tag_error")
          release_file="$RUNNER_TEMP/target-release.json"
          release_inventory="$RUNNER_TEMP/target-release-inventory.jsons"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[]' >"$release_inventory"
          release_status=$(release_by_tag \
            "$release_inventory" "$tag" "$release_file")
          target_workflow_commit=$GITHUB_SHA
          if [[ $tag_status == present ]]; then
            tag_ref=$(<"$tag_file")
            test "$(jq -r '.object.type' <<<"$tag_ref")" = commit
            target_workflow_commit=$(jq -r '.object.sha' <<<"$tag_ref")
            printf '%s' "$target_workflow_commit" | grep -Eq '^[0-9a-f]{40}$'
            if [[ $replacement != true ]]; then
              test "$target_workflow_commit" = "$GITHUB_SHA"
            fi
          fi
          already_published=false
          if [[ $release_status == present ]]; then
            target_release=$(<"$release_file")
            if [[ $(jq -r '.immutable' <<<"$target_release") == true ]]; then
              test "$tag_status" = present
              test "$(jq -r '.draft' <<<"$target_release")" = false
              test "$(jq -r '.prerelease' <<<"$target_release")" = false
              target_dir="$RUNNER_TEMP/published-target"
              mkdir -m 0700 "$target_dir"
              jq -r '.assets[].name' <<<"$target_release" \
                >"$RUNNER_TEMP/target-assets.txt"
              test "$(bash public-workflow/scripts/release-authority-manifest.sh \
                asset-schema "$RUNNER_TEMP/target-assets.txt")" = 2
              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" --dir "$target_dir"
              gh release verify "$tag" \
                --repo "$GITHUB_REPOSITORY" >/dev/null
              while IFS= read -r asset; do
                gh release verify-asset "$tag" "$target_dir/$asset" \
                  --repo "$GITHUB_REPOSITORY" >/dev/null
              done <"$RUNNER_TEMP/target-assets.txt"
              target_manifest="$target_dir/release-authority-v2.json"
              bash public-workflow/scripts/release-authority-manifest.sh validate \
                "$target_manifest" 2 "$generation" \
                "$target_workflow_commit" "$target_dir"
              if [[ $genesis == true ]]; then
                bash public-workflow/scripts/release-authority-manifest.sh \
                  assert-genesis "$target_manifest"
              else
                bash public-workflow/scripts/release-authority-manifest.sh \
                  assert-successor "$previous_manifest" "$target_manifest"
              fi
              jq -e --argjson approval "$APPROVAL_RECORD" '
                .previous_generation == $approval.previous_generation and
                .previous_manifest_sha256 == $approval.previous_manifest_sha256 and
                .authority_version == $approval.authority_version and
                .authority_commit == $approval.authority_commit and
                .verification_policy_revision == $approval.verification_policy_revision and
                .authority_tree_sha256 == $approval.authority_tree_sha256 and
                .shipper_sha256 == $approval.shipper_sha256 and
                .verifier_sha256 == $approval.verifier_sha256 and
                .approved_baseline_profile == $approval.baseline_profile and
                .approved_baseline_generation == $approval.baseline_generation and
                .approved_baseline_tree_sha256 == $approval.baseline_tree_sha256 and
                .approved_browser_bundle_sha256 == $approval.browser_bundle_sha256 and
                .approved_browser_version == $approval.browser_version and
                .approved_browser_launch_profile_sha256 == $approval.browser_launch_profile_sha256 and
                .verifier_schema == $approval.verifier_schema and
                .provisioner_sha256 == $approval.provisioner_sha256 and
                .production_contract_sha256 == $approval.production_contract_sha256 and
                .production_member_count == $approval.production_member_count and
                .receipt_schema == $approval.receipt_schema and
                .build_authority_schema == $approval.build_authority_schema and
                .promotion_recovery_schema == $approval.promotion_recovery_schema and
                .promotion_recovery_sha256 == $approval.promotion_recovery_sha256
              ' "$target_manifest" >/dev/null
              cosign verify-blob \
                --bundle "$target_dir/release-authority-v2.json.cosign.bundle" \
                --certificate-identity \
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                --certificate-github-workflow-sha "$target_workflow_commit" \
                "$target_manifest"
              if [[ $replacement == true ]]; then
                target_already_published=true
              else
                already_published=true
              fi
            else
              test "$(jq -r '.draft' <<<"$target_release")" = true
              test "$(jq -r '.prerelease' <<<"$target_release")" = false
              if [[ $tag_status == absent ]]; then
                test "$(jq -r '.target_commitish' <<<"$target_release")" \
                  = "$GITHUB_SHA"
              fi
            fi
          elif [[ $tag_status == present ]]; then
            test "$(jq -r '.object.sha' "$tag_file")" = "$GITHUB_SHA"
          fi

          {
            printf 'generation=%s\n' "$generation"
            printf 'previous_generation=%s\n' "$previous"
            printf 'previous_manifest_sha256=%s\n' "$previous_manifest_sha256"
            printf 'previous_schema=%s\n' "$previous_schema"
            printf 'previous_workflow_commit=%s\n' "$previous_workflow_commit"
            printf 'target_tag=%s\n' "$target_tag"
            printf 'replacement=%s\n' "$replacement"
            printf 'target_already_published=%s\n' "$target_already_published"
            printf 'already_published=%s\n' "$already_published"
            printf 'genesis=%s\n' "$genesis"
          } >>"$GITHUB_OUTPUT"

  repository_policy:
    needs: predecessor
    if: >-
      (needs.predecessor.outputs.already_published != 'true' &&
       needs.predecessor.outputs.target_already_published != 'true') ||
      (needs.predecessor.outputs.target_already_published == 'true' &&
       inputs.resolution_revision == '3')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-authority-source
    permissions:
      contents: read
    steps:
      - name: Checkout exact public policy verifier
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Fail closed before any private-source secret is used
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNTAUR_RELEASE_AUTHORITY_ADMIN_READ_TOKEN }}
        run: bash public-workflow/scripts/verify-release-authority-policy.sh

  source_metadata:
    needs:
      - predecessor
      - repository_policy
    if: >-
      (needs.predecessor.outputs.already_published != 'true' &&
       needs.predecessor.outputs.target_already_published != 'true') ||
      (needs.predecessor.outputs.target_already_published == 'true' &&
       inputs.resolution_revision == '3')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-authority-source
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      authority_tree_sha256: ${{ steps.metadata.outputs.authority_tree_sha256 }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
    steps:
      - name: Checkout exact public verification helpers
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Select exact private source tuple without executing it
        id: source
        shell: bash
        env:
          GENERATION: ${{ needs.predecessor.outputs.generation }}
          TARGET_ALREADY_PUBLISHED: ${{ needs.predecessor.outputs.target_already_published }}
          RESOLUTION_REVISION: ${{ inputs.resolution_revision }}
          AUTHORITY_COMMIT: ${{ fromJSON(inputs.approval_record).authority_commit }}
          AUTHORITY_TREE_SHA256: ${{ fromJSON(inputs.approval_record).authority_tree_sha256 }}
          AUTHORITY_VERSION: ${{ fromJSON(inputs.approval_record).authority_version }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
        run: |
          set -euo pipefail
          source_mode=authority
          source_commit=$AUTHORITY_COMMIT
          source_tree_sha256=$AUTHORITY_TREE_SHA256
          source_parent=$VERIFICATION_POLICY_REVISION
          source_version=$AUTHORITY_VERSION
          if [[ $TARGET_ALREADY_PUBLISHED == true ]]; then
            test "$RESOLUTION_REVISION" = 3
            source_mode=replacement-proof-helper
            correction="public-workflow/.github/authority-resolution-corrections/g${GENERATION}-r3.json"
            review="public-workflow/.github/authority-replacement-reviews/g${GENERATION}.json"
            bash public-workflow/scripts/release-authority-manifest.sh \
              validate-resolution-correction-review "$correction"
            bash public-workflow/scripts/release-authority-manifest.sh \
              validate-selection-review "$review"
            test "$(jq -er '.generation' "$correction")" = "$GENERATION"
            test "$(jq -er '.selected_generation' "$review")" = "$GENERATION"
            source_commit=$(jq -er '.proof_helper_source_commit' "$correction")
            source_tree_sha256=$(jq -er \
              '.proof_helper_source_tree_sha256' "$correction")
            source_parent=$(jq -er \
              '.superseded_planned_product_base_commit' "$correction")
            source_version=$(jq -er '.selected_authority_version' "$review")
            test "$source_commit" \
              = "$(jq -er '.corrected_planned_product_base_commit' "$correction")"
          fi
          printf '%s' "$source_commit" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$source_parent" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$source_tree_sha256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$source_version" \
            | grep -Eq '^(0|[1-9][0-9]{0,9})\.(0|[1-9][0-9]{0,9})\.(0|[1-9][0-9]{0,9})$'
          {
            printf 'source_mode=%s\n' "$source_mode"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'source_tree_sha256=%s\n' "$source_tree_sha256"
            printf 'source_parent=%s\n' "$source_parent"
            printf 'source_version=%s\n' "$source_version"
          } >>"$GITHUB_OUTPUT"

      - name: Export exact private source metadata without executing it
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: buddyholly007/syntaur
          ref: ${{ steps.source.outputs.source_commit }}
          ssh-key: ${{ secrets.SYNTAUR_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source
          fetch-depth: 2

      - name: Prove credential removal, review, and encrypt exact source
        id: metadata
        shell: bash
        env:
          SOURCE_MODE: ${{ steps.source.outputs.source_mode }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TREE_SHA256: ${{ steps.source.outputs.source_tree_sha256 }}
          SOURCE_PARENT: ${{ steps.source.outputs.source_parent }}
          SOURCE_VERSION: ${{ steps.source.outputs.source_version }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
          EXPECTED_PROVISIONER_SHA256: ${{ fromJSON(inputs.approval_record).provisioner_sha256 }}
          VERIFIER_SCHEMA: ${{ fromJSON(inputs.approval_record).verifier_schema }}
          GENESIS: ${{ needs.predecessor.outputs.genesis }}
        run: |
          set -euo pipefail
          test -z "$(git -C source config --local --get-all core.sshCommand || true)"
          test -z "$(git -C source config --local \
            --get-all http.https://github.com/.extraheader || true)"
          leaked_keys=$(find "$RUNNER_TEMP" -type f -size -128k -print0 \
            | xargs -0 -r grep -Il '^-----BEGIN OPENSSH PRIVATE KEY-----$' || true)
          test -z "$leaked_keys"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          if [[ $SOURCE_MODE == replacement-proof-helper ]]; then
            test "$GENESIS" = false
            test "$(git -C source rev-list --parents -n 1 HEAD | awk '{print NF}')" = 2
            test "$(git -C source rev-parse HEAD^)" = "$SOURCE_PARENT"
          elif [[ $GENESIS == true ]]; then
            test "$SOURCE_MODE" = authority
            test "$VERIFICATION_POLICY_REVISION" = "$SOURCE_COMMIT"
            g1_parser_root="$RUNNER_TEMP/g1-toml-parser"
            mkdir -m 0700 "$g1_parser_root"
            /usr/bin/curl -fsSLo "$g1_parser_root/yq.download" \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            printf '%s  %s\n' \
              "$YQ_LINUX_AMD64_SHA256" "$g1_parser_root/yq.download" \
              | sha256sum -c - >/dev/null
            install -m 0500 "$g1_parser_root/yq.download" "$g1_parser_root/yq"
            bash public-workflow/scripts/verify-g1-authority-source.sh \
              source \
              "$SOURCE_COMMIT" \
              b003360f63707d92fd0df1fd12384282f1c3004f \
              1bf740acd5a7223e98370f668148f01ebfb6eff8 \
              0.7.114 \
              "$g1_parser_root/yq"
          else
            test "$SOURCE_MODE" = authority
            test "$(git -C source rev-parse "${SOURCE_COMMIT}^")" \
              = "$SOURCE_PARENT"
          fi
          cmp -s source/VERSION <(printf '%s' "$SOURCE_VERSION") \
            || cmp -s source/VERSION <(printf '%s\n' "$SOURCE_VERSION")
          source_schema=$(sed -nE \
            's/^pub const VERIFICATION_ATTESTATION_SCHEMA_VERSION: u32 = ([0-9]+);$/\1/p' \
            source/crates/syntaur-verify/src/run.rs)
          test "$source_schema" = "$VERIFIER_SCHEMA"
          test -f source/scripts/provision-syntaur-build-authority.sh
          test ! -L source/scripts/provision-syntaur-build-authority.sh
          test "$(head -n 1 source/scripts/provision-syntaur-build-authority.sh)" \
            = '#!/usr/bin/bash'
          test "$(sha256sum source/scripts/provision-syntaur-build-authority.sh \
            | awk '{print $1}')" = "$EXPECTED_PROVISIONER_SHA256"
          authority_tree_sha256=$(bash \
            public-workflow/scripts/release-authority-manifest.sh \
            source-tree-sha256 source "$SOURCE_COMMIT")
          test "$authority_tree_sha256" = "$SOURCE_TREE_SHA256"
          source_date_epoch=$(git -C source show -s --format=%ct "$SOURCE_COMMIT")
          printf '%s' "$source_date_epoch" | grep -Eq '^[1-9][0-9]{0,11}$'
          {
            printf 'source_commit=%s\n' "$SOURCE_COMMIT"
            printf 'authority_tree_sha256=%s\n' "$authority_tree_sha256"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
          } >>"$GITHUB_OUTPUT"

          while IFS= read -r -d '' tracked; do
            [[ $tracked != /* && $tracked != *..* ]]
            if LC_ALL=C grep -q '[[:cntrl:]]' <<<"$tracked"; then
              exit 1
            fi
          done < <(git -C source ls-files -z)
          test -z "$(find source -type l -print -quit)"
          test -z "$(find source -type f -links +1 -print -quit)"
          test -z "$(find source \( -type b -o -type c -o -type p -o -type s \) \
            -print -quit)"

          age_root="$RUNNER_TEMP/age"
          mkdir -m 0700 "$age_root"
          /usr/bin/curl -fsSLo "$age_root/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' \
            "$AGE_LINUX_AMD64_SHA256" "$age_root/age.tar.gz" \
            | sha256sum -c - >/dev/null
          tar -xzf "$age_root/age.tar.gz" -C "$age_root"
          install -m 0500 "$age_root/age/age" "$age_root/age-bin"

          source_archive="$RUNNER_TEMP/source.tar"
          tar \
            --sort=name \
            --format=gnu \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf "$source_archive" \
            source
          source_archive_sha256=$(sha256sum "$source_archive" | awk '{print $1}')
          export_dir="$RUNNER_TEMP/encrypted-source-export"
          mkdir -m 0700 "$export_dir"
          "$age_root/age-bin" \
            --encrypt \
            --recipient "$SOURCE_ARCHIVE_AGE_RECIPIENT" \
            --output "$export_dir/source.tar.age" \
            "$source_archive"
          ciphertext_sha256=$(sha256sum \
            "$export_dir/source.tar.age" | awk '{print $1}')
          jq -cjn \
            --argjson schema 1 \
            --arg authority_commit "$SOURCE_COMMIT" \
            --arg authority_tree_sha256 "$authority_tree_sha256" \
            --argjson source_date_epoch "$source_date_epoch" \
            --arg source_archive_sha256 "$source_archive_sha256" \
            --arg ciphertext_sha256 "$ciphertext_sha256" \
            --arg recipient "$SOURCE_ARCHIVE_AGE_RECIPIENT" \
            '{
              schema:$schema,
              authority_commit:$authority_commit,
              authority_tree_sha256:$authority_tree_sha256,
              source_date_epoch:$source_date_epoch,
              source_archive_sha256:$source_archive_sha256,
              ciphertext_sha256:$ciphertext_sha256,
              recipient:$recipient
            }' >"$export_dir/source-export.json"
          chmod 0400 "$export_dir/source.tar.age" "$export_dir/source-export.json"
          rm -f "$source_archive"
          rm -rf source "$age_root"

      - name: Upload only encrypted private source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: encrypted-authority-source-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-source-export
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  isolated_build:
    needs:
      - predecessor
      - source_metadata
    if: needs.predecessor.outputs.already_published != 'true' && needs.predecessor.outputs.target_already_published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: jammy
            runner: ubuntu-22.04
          - builder: noble
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    environment: release-authority-source
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact public verification helpers
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Download encrypted source export
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: encrypted-authority-source-run-${{ github.run_id }}-attempt-*
          path: encrypted-source-artifacts

      - name: Select newest immutable source export from this run
        shell: bash
        run: |
          set -euo pipefail
          selected=$(find encrypted-source-artifacts \
            -mindepth 1 -maxdepth 1 -type d \
            -name "encrypted-authority-source-run-${GITHUB_RUN_ID}-attempt-*" \
            -printf '%f\n' | sort -V | sed -n '$p')
          if [[ -n $selected ]]; then
            test -z "$(find encrypted-source-artifacts \
              -mindepth 1 -maxdepth 1 ! -type d -print -quit)"
            mv "encrypted-source-artifacts/$selected" encrypted-source
          else
            test -z "$(find encrypted-source-artifacts \
              -mindepth 1 -maxdepth 1 -type d -print -quit)"
            mv encrypted-source-artifacts encrypted-source
          fi

      - name: Decrypt with a zero-authority step-scoped identity
        shell: bash
        env:
          SOURCE_ARCHIVE_AGE_IDENTITY: ${{ secrets.SYNTAUR_SOURCE_ARCHIVE_AGE_IDENTITY }}
          AUTHORITY_COMMIT: ${{ fromJSON(inputs.approval_record).authority_commit }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
          AUTHORITY_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
        run: |
          set -euo pipefail
          expected_names=$(printf '%s\n' source-export.json source.tar.age | LC_ALL=C sort)
          actual_names=$(find encrypted-source -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)
          test "$actual_names" = "$expected_names"
          test "$(jq -er '.schema' encrypted-source/source-export.json)" = 1
          test "$(jq -er '.authority_commit' encrypted-source/source-export.json)" \
            = "$AUTHORITY_COMMIT"
          test "$(jq -er '.authority_tree_sha256' encrypted-source/source-export.json)" \
            = "$AUTHORITY_TREE_SHA256"
          test "$(jq -er '.source_date_epoch' encrypted-source/source-export.json)" \
            = "${{ needs.source_metadata.outputs.source_date_epoch }}"
          test "$(jq -er '.recipient' encrypted-source/source-export.json)" \
            = "$SOURCE_ARCHIVE_AGE_RECIPIENT"
          test "$(sha256sum encrypted-source/source.tar.age | awk '{print $1}')" \
            = "$(jq -er '.ciphertext_sha256' encrypted-source/source-export.json)"

          age_root="$RUNNER_TEMP/age"
          mkdir -m 0700 "$age_root"
          /usr/bin/curl -fsSLo "$age_root/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' \
            "$AGE_LINUX_AMD64_SHA256" "$age_root/age.tar.gz" \
            | sha256sum -c - >/dev/null
          tar -xzf "$age_root/age.tar.gz" -C "$age_root"
          mkdir -m 0700 "$age_root/bin"
          install -m 0500 \
            "$age_root/age/age" "$age_root/age/age-keygen" \
            "$age_root/bin/"
          derived_recipient=$(printf '%s\n' "$SOURCE_ARCHIVE_AGE_IDENTITY" \
            | "$age_root/bin/age-keygen" -y -)
          test "$derived_recipient" = "$SOURCE_ARCHIVE_AGE_RECIPIENT"
          source_archive="$RUNNER_TEMP/source.tar"
          printf '%s\n' "$SOURCE_ARCHIVE_AGE_IDENTITY" \
            | "$age_root/bin/age" \
                --decrypt \
                --identity - \
                --output "$source_archive" \
                encrypted-source/source.tar.age
          unset SOURCE_ARCHIVE_AGE_IDENTITY
          test "$(sha256sum "$source_archive" | awk '{print $1}')" \
            = "$(jq -er '.source_archive_sha256' \
                encrypted-source/source-export.json)"
          test "$(tar -tf "$source_archive" | sed -n '1p')" = source/
          if tar -tf "$source_archive" \
            | grep -Ev '^source(/|$)' >/dev/null; then
            exit 1
          fi
          tar \
            --extract \
            --file "$source_archive" \
            --directory "$GITHUB_WORKSPACE" \
            --no-same-owner \
            --no-same-permissions
          rm -f "$source_archive"
          rm -rf "$age_root"

      - name: Prove plaintext source has no credential authority
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ fromJSON(inputs.approval_record).authority_commit }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
          AUTHORITY_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
        run: |
          set -euo pipefail
          test -z "${SOURCE_ARCHIVE_AGE_IDENTITY:-}"
          test -z "${SYNTAUR_SOURCE_DEPLOY_KEY:-}"
          leaked_identities=$(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" \
            -type f -size -128k -print0 \
            | xargs -0 -r grep -Il \
                -e '^AGE-SECRET-KEY-' \
                -e '^-----BEGIN OPENSSH PRIVATE KEY-----$' || true)
          test -z "$leaked_identities"
          test -z "$(git -C source config --local --get-all core.sshCommand || true)"
          test -z "$(git -C source config --local \
            --get-all http.https://github.com/.extraheader || true)"
          test -z "$(find source -type l -print -quit)"
          test -z "$(find source -type f -links +1 -print -quit)"
          test "$(git -C source rev-parse HEAD)" = "$AUTHORITY_COMMIT"
          test "$(bash public-workflow/scripts/release-authority-manifest.sh \
            source-tree-sha256 source "$AUTHORITY_COMMIT")" = "$AUTHORITY_TREE_SHA256"
          sudo chown -R 65534:65534 source
          test "$(stat -c '%u:%g' source)" = 65534:65534

      - name: Prepare pinned offline builder
        shell: bash
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          set -euo pipefail
          builder_context="$RUNNER_TEMP/authority-builder-context"
          mkdir -m 0700 "$builder_context"
          builder_file="$builder_context/Dockerfile"
          {
            printf 'FROM %s\n' "$AUTHORITY_BUILDER_IMAGE"
            cat <<'EOF'
          RUN rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources \
              && printf '%s\n' \
                'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260727T000000Z bookworm main' \
                'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260727T000000Z bookworm-updates main' \
                > /etc/apt/sources.list \
              && apt-get -o Acquire::Check-Valid-Until=false update \
              && apt-get install -y --no-install-recommends \
                ca-certificates git libdbus-1-dev pkg-config \
              && rm -rf /var/lib/apt/lists/*
          EOF
          } >"$builder_file"
          test "$(grep -c '^FROM rust@sha256:' "$builder_file")" -eq 1
          docker pull "$AUTHORITY_BUILDER_IMAGE"
          docker build \
            --pull=false \
            --file "$builder_file" \
            --tag "syntaur-authority-builder:${BUILDER}" \
            "$builder_context"
          image_id=$(docker image inspect \
            "syntaur-authority-builder:${BUILDER}" --format '{{.Id}}')
          printf '%s' "$image_id" | grep -Eq '^sha256:[0-9a-f]{64}$'

      - name: Fetch locked dependencies without candidate execution
        shell: bash
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          set -euo pipefail
          mkdir -m 0755 "$RUNNER_TEMP/authority-cargo" "$RUNNER_TEMP/authority-target"
          sudo chown 65534:65534 \
            "$RUNNER_TEMP/authority-cargo" "$RUNNER_TEMP/authority-target"
          docker run --rm \
            --network bridge \
            --read-only \
            --user 65534:65534 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/source,dst=/source,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/authority-cargo,dst=/cargo" \
            --workdir /tmp \
            --env CARGO_HOME=/cargo \
            --env CARGO_NET_GIT_FETCH_WITH_CLI=false \
            --env CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse \
            "syntaur-authority-builder:${BUILDER}" \
            /usr/bin/bash --noprofile --norc -ceu '
              cargo fetch \
                --config "registry.global-credential-providers=[]" \
                --config "net.git-fetch-with-cli=false" \
                --manifest-path /source/Cargo.toml \
                --locked \
                --target x86_64-unknown-linux-gnu \
                >/tmp/cargo-fetch.log 2>&1
            '
          printf 'locked dependency fetch completed without publishing private diagnostics\n'

      - name: Build and self-test candidate without network, secrets, or host authority
        shell: bash
        env:
          BUILDER: ${{ matrix.builder }}
          SOURCE_DATE_EPOCH: ${{ needs.source_metadata.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --user 65534:65534 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 1024 \
            --memory 14g \
            --cpus 4 \
            --tmpfs /tmp:rw,nosuid,nodev,size=4g \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/source,dst=/source,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/authority-cargo,dst=/cargo" \
            --mount "type=bind,src=${RUNNER_TEMP}/authority-target,dst=/target" \
            --workdir /source \
            --env HOME=/tmp/home \
            --env CARGO_HOME=/cargo \
            --env CARGO_TARGET_DIR=/target \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_NET_OFFLINE=true \
            --env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/source \
            "syntaur-authority-builder:${BUILDER}" \
            /usr/bin/bash --noprofile --norc -ceu '
              {
                cargo build --release --frozen --offline \
                  --target x86_64-unknown-linux-gnu \
                  -p syntaur-ship -p syntaur-verify
                /target/x86_64-unknown-linux-gnu/release/syntaur-ship \
                  authority-protocol-inputs > /target/authority-protocol.json
                /target/x86_64-unknown-linux-gnu/release/syntaur-ship \
                  authority-protocol-self-test > /target/shipper-self-test.json
                /target/x86_64-unknown-linux-gnu/release/syntaur-verify \
                  --authority-protocol-self-test > /target/verifier-self-test.json
              } >/tmp/candidate-build.log 2>&1
            '
          printf 'candidate build and self-tests completed without publishing private diagnostics\n'

      - name: Record exact reproducible candidate
        shell: bash
        env:
          BUILDER: ${{ matrix.builder }}
          EXPECTED_SHIPPER_SHA256: ${{ fromJSON(inputs.approval_record).shipper_sha256 }}
          EXPECTED_VERIFIER_SHA256: ${{ fromJSON(inputs.approval_record).verifier_sha256 }}
          EXPECTED_PROVISIONER_SHA256: ${{ fromJSON(inputs.approval_record).provisioner_sha256 }}
          AUTHORITY_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          # The quoted script expands inside the pinned container.
          # shellcheck disable=SC2016
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          mkdir -m 0700 "$candidate"
          install -m 0500 \
            "$RUNNER_TEMP/authority-target/x86_64-unknown-linux-gnu/release/syntaur-ship" \
            "$candidate/syntaur-ship-linux-x86_64"
          install -m 0500 \
            "$RUNNER_TEMP/authority-target/x86_64-unknown-linux-gnu/release/syntaur-verify" \
            "$candidate/syntaur-verify-linux-x86_64"
          install -m 0500 \
            source/scripts/provision-syntaur-build-authority.sh \
            "$candidate/syntaur-build-authority-provision"
          install -m 0400 \
            "$RUNNER_TEMP/authority-target/authority-protocol.json" \
            "$candidate/authority-protocol.json"
          install -m 0400 \
            "$RUNNER_TEMP/authority-target/shipper-self-test.json" \
            "$candidate/shipper-self-test.json"
          install -m 0400 \
            "$RUNNER_TEMP/authority-target/verifier-self-test.json" \
            "$candidate/verifier-self-test.json"
          shipper_sha256=$(sha256sum \
            "$candidate/syntaur-ship-linux-x86_64" | awk '{print $1}')
          verifier_sha256=$(sha256sum \
            "$candidate/syntaur-verify-linux-x86_64" | awk '{print $1}')
          provisioner_sha256=$(sha256sum \
            "$candidate/syntaur-build-authority-provision" | awk '{print $1}')
          test "$shipper_sha256" = "$EXPECTED_SHIPPER_SHA256"
          test "$verifier_sha256" = "$EXPECTED_VERIFIER_SHA256"
          test "$provisioner_sha256" = "$EXPECTED_PROVISIONER_SHA256"
          printf '%s' "$APPROVAL_RECORD" >"$RUNNER_TEMP/approval-record.json"
          chmod 0400 "$RUNNER_TEMP/approval-record.json"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-approval-record "$RUNNER_TEMP/approval-record.json"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-shipper-self-test \
            "$candidate/shipper-self-test.json" \
            "$RUNNER_TEMP/approval-record.json"

          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "syntaur-authority-builder:${BUILDER}" \
            /usr/bin/bash --noprofile --norc -ceu '
              root=$(rustc --print sysroot)
              printf "VERIFIER_TOOLCHAIN_ID=rust-%s-x86_64-unknown-linux-gnu\n" \
                "$(rustc --version --verbose | sed -nE "s/^release: (.+)$/\1/p")"
              printf "VERIFIER_CARGO_SHA256=%s\n" \
                "$(sha256sum "$root/bin/cargo" | awk "{print \$1}")"
              printf "VERIFIER_RUSTC_SHA256=%s\n" \
                "$(sha256sum "$root/bin/rustc" | awk "{print \$1}")"
              printf "VERIFIER_RUSTDOC_SHA256=%s\n" \
                "$(sha256sum "$root/bin/rustdoc" | awk "{print \$1}")"
            ' >"$RUNNER_TEMP/toolchain.env"
          set -a
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/toolchain.env"
          set +a
          jq -cjn \
            --arg authority_tree_sha256 "$AUTHORITY_TREE_SHA256" \
            --arg shipper_sha256 "$shipper_sha256" \
            --arg verifier_sha256 "$verifier_sha256" \
            --arg provisioner_sha256 "$provisioner_sha256" \
            --arg verifier_toolchain_id "$VERIFIER_TOOLCHAIN_ID" \
            --arg verifier_cargo_sha256 "$VERIFIER_CARGO_SHA256" \
            --arg verifier_rustc_sha256 "$VERIFIER_RUSTC_SHA256" \
            --arg verifier_rustdoc_sha256 "$VERIFIER_RUSTDOC_SHA256" \
            '{
              schema:1,
              authority_tree_sha256:$authority_tree_sha256,
              shipper_sha256:$shipper_sha256,
              verifier_sha256:$verifier_sha256,
              provisioner_sha256:$provisioner_sha256,
              verifier_toolchain_id:$verifier_toolchain_id,
              verifier_cargo_sha256:$verifier_cargo_sha256,
              verifier_rustc_sha256:$verifier_rustc_sha256,
              verifier_rustdoc_sha256:$verifier_rustdoc_sha256
            }' >"$candidate/build-metadata.json"
          chmod 0400 "$candidate/build-metadata.json"

      - name: Upload source-free candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: authority-candidate-${{ matrix.builder }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  compare_builds:
    needs:
      - predecessor
      - source_metadata
      - isolated_build
    if: needs.predecessor.outputs.already_published != 'true' && needs.predecessor.outputs.target_already_published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact public verification helpers
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Download both isolated builds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: authority-candidate-*-run-${{ github.run_id }}-attempt-*
          path: candidates

      - name: Require byte-identical builds and exact candidate protocols
        id: comparison
        shell: bash
        env:
          AUTHORITY_GENERATION: ${{ needs.predecessor.outputs.generation }}
          PREVIOUS_AUTHORITY_GENERATION: ${{ needs.predecessor.outputs.previous_generation }}
          PREVIOUS_AUTHORITY_MANIFEST_SHA256: ${{ needs.predecessor.outputs.previous_manifest_sha256 }}
          AUTHORITY_VERSION: ${{ fromJSON(inputs.approval_record).authority_version }}
          AUTHORITY_COMMIT: ${{ fromJSON(inputs.approval_record).authority_commit }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
          AUTHORITY_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
          EXPECTED_SHIPPER_SHA256: ${{ fromJSON(inputs.approval_record).shipper_sha256 }}
          EXPECTED_VERIFIER_SHA256: ${{ fromJSON(inputs.approval_record).verifier_sha256 }}
          EXPECTED_PROVISIONER_SHA256: ${{ fromJSON(inputs.approval_record).provisioner_sha256 }}
          PRODUCTION_CONTRACT_SHA256: ${{ fromJSON(inputs.approval_record).production_contract_sha256 }}
          PRODUCTION_MEMBER_COUNT: ${{ fromJSON(inputs.approval_record).production_member_count }}
          RECEIPT_SCHEMA: ${{ fromJSON(inputs.approval_record).receipt_schema }}
          BUILD_AUTHORITY_SCHEMA: ${{ fromJSON(inputs.approval_record).build_authority_schema }}
          PROMOTION_RECOVERY_SCHEMA: ${{ fromJSON(inputs.approval_record).promotion_recovery_schema }}
          PROMOTION_RECOVERY_SHA256: ${{ fromJSON(inputs.approval_record).promotion_recovery_sha256 }}
          BASELINE_PROFILE: ${{ fromJSON(inputs.approval_record).baseline_profile }}
          BASELINE_GENERATION: ${{ fromJSON(inputs.approval_record).baseline_generation }}
          BASELINE_TREE_SHA256: ${{ fromJSON(inputs.approval_record).baseline_tree_sha256 }}
          BROWSER_BUNDLE_SHA256: ${{ fromJSON(inputs.approval_record).browser_bundle_sha256 }}
          BROWSER_VERSION: ${{ fromJSON(inputs.approval_record).browser_version }}
          BROWSER_LAUNCH_PROFILE_SHA256: ${{ fromJSON(inputs.approval_record).browser_launch_profile_sha256 }}
          VERIFIER_SCHEMA: ${{ fromJSON(inputs.approval_record).verifier_schema }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          set -euo pipefail
          first=$(find candidates -mindepth 1 -maxdepth 1 -type d \
            -name "authority-candidate-jammy-run-${GITHUB_RUN_ID}-attempt-*" \
            -printf '%f\n' | sort -V | sed -n '$p')
          second=$(find candidates -mindepth 1 -maxdepth 1 -type d \
            -name "authority-candidate-noble-run-${GITHUB_RUN_ID}-attempt-*" \
            -printf '%f\n' | sort -V | sed -n '$p')
          test -n "$first"
          test -n "$second"
          first="candidates/$first"
          second="candidates/$second"
          expected=$(printf '%s\n' \
            authority-protocol.json \
            build-metadata.json \
            shipper-self-test.json \
            syntaur-build-authority-provision \
            syntaur-ship-linux-x86_64 \
            syntaur-verify-linux-x86_64 \
            verifier-self-test.json | LC_ALL=C sort)
          for candidate in "$first" "$second"; do
            actual=$(find "$candidate" -mindepth 1 -maxdepth 1 -type f \
              -printf '%f\n' | LC_ALL=C sort)
            test "$actual" = "$expected"
          done
          while IFS= read -r file; do
            cmp "$first/$file" "$second/$file"
          done <<<"$expected"
          SHIPPER_SHA256=$(jq -er '.shipper_sha256' "$first/build-metadata.json")
          VERIFIER_SHA256=$(jq -er '.verifier_sha256' "$first/build-metadata.json")
          PROVISIONER_SHA256=$(jq -er '.provisioner_sha256' "$first/build-metadata.json")
          VERIFIER_TOOLCHAIN_ID=$(jq -er '.verifier_toolchain_id' "$first/build-metadata.json")
          VERIFIER_CARGO_SHA256=$(jq -er '.verifier_cargo_sha256' "$first/build-metadata.json")
          VERIFIER_RUSTC_SHA256=$(jq -er '.verifier_rustc_sha256' "$first/build-metadata.json")
          VERIFIER_RUSTDOC_SHA256=$(jq -er '.verifier_rustdoc_sha256' "$first/build-metadata.json")
          test "$SHIPPER_SHA256" = "$EXPECTED_SHIPPER_SHA256"
          test "$VERIFIER_SHA256" = "$EXPECTED_VERIFIER_SHA256"
          test "$PROVISIONER_SHA256" = "$EXPECTED_PROVISIONER_SHA256"
          test "$(jq -er '.authority_tree_sha256' "$first/build-metadata.json")" \
            = "$AUTHORITY_TREE_SHA256"
          export SHIPPER_SHA256 VERIFIER_SHA256 PROVISIONER_SHA256
          export VERIFIER_TOOLCHAIN_ID VERIFIER_CARGO_SHA256
          export VERIFIER_RUSTC_SHA256 VERIFIER_RUSTDOC_SHA256
          export GITHUB_SHA
          bash public-workflow/scripts/release-authority-manifest.sh \
            render-v2 "$first/review-manifest.json"
          bash public-workflow/scripts/release-authority-manifest.sh validate \
            "$first/review-manifest.json" \
            2 \
            "$AUTHORITY_GENERATION" \
            "$GITHUB_SHA" \
            "$first"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-protocol \
            "$first/authority-protocol.json" \
            "$first/review-manifest.json"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-shipper-self-test \
            "$first/shipper-self-test.json" \
            "$first/review-manifest.json"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-verifier-self-test \
            "$first/verifier-self-test.json" \
            "$first/review-manifest.json"
          cp "$first/review-manifest.json" "$second/review-manifest.json"
          approval_record_sha256=$(printf '%s' "$APPROVAL_RECORD" \
            | sha256sum | awk '{print $1}')
          review_manifest_sha256=$(sha256sum "$first/review-manifest.json" \
            | awk '{print $1}')
          printf 'reviewed_candidate_path=%s\n' "$first" >>"$GITHUB_OUTPUT"
          {
            printf '## Release-authority candidate awaiting approval\n\n'
            printf -- '- Generation: %s (predecessor %s)\n' \
              "$AUTHORITY_GENERATION" "$PREVIOUS_AUTHORITY_GENERATION"
            printf -- '- Predecessor manifest: %s\n' \
              "$PREVIOUS_AUTHORITY_MANIFEST_SHA256"
            printf -- '- Source: %s / tree %s\n' \
              "$AUTHORITY_COMMIT" "$AUTHORITY_TREE_SHA256"
            printf -- '- Verification policy revision: %s\n' \
              "$VERIFICATION_POLICY_REVISION"
            printf -- '- Shipper: %s\n' "$SHIPPER_SHA256"
            printf -- '- Verifier: %s\n' "$VERIFIER_SHA256"
            printf -- '- Provisioner: %s\n' "$PROVISIONER_SHA256"
            printf -- '- Production contract: %s\n' "$PRODUCTION_CONTRACT_SHA256"
            printf -- '- Promotion recovery: %s\n' "$PROMOTION_RECOVERY_SHA256"
            printf -- '- Baseline: %s / %s / %s\n' \
              "$BASELINE_PROFILE" "$BASELINE_GENERATION" "$BASELINE_TREE_SHA256"
            printf -- '- Browser: %s / %s / %s\n' \
              "$BROWSER_VERSION" \
              "$BROWSER_BUNDLE_SHA256" \
              "$BROWSER_LAUNCH_PROFILE_SHA256"
            printf -- '- Verifier schema: %s\n' "$VERIFIER_SCHEMA"
            printf -- '- Toolchain: %s\n' "$VERIFIER_TOOLCHAIN_ID"
            printf -- '- Cargo: %s\n' "$VERIFIER_CARGO_SHA256"
            printf -- '- rustc: %s\n' "$VERIFIER_RUSTC_SHA256"
            printf -- '- rustdoc: %s\n' "$VERIFIER_RUSTDOC_SHA256"
            printf -- '- Approval record SHA-256: %s\n' "$approval_record_sha256"
            printf -- '- Canonical manifest SHA-256: %s\n\n' \
              "$review_manifest_sha256"
            printf '```json\n'
            sed -n '1p' "$first/review-manifest.json"
            printf '\n```\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewed-authority-candidate-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.comparison.outputs.reviewed_candidate_path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  approval_policy:
    needs:
      - predecessor
      - source_metadata
      - compare_builds
      - repository_policy
    if: needs.predecessor.outputs.already_published != 'true' && needs.predecessor.outputs.target_already_published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-authority
    permissions:
      contents: read
    steps:
      - name: Checkout exact public policy verifier
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Require exact independent environment policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNTAUR_RELEASE_AUTHORITY_ADMIN_READ_TOKEN }}
        run: bash public-workflow/scripts/verify-release-authority-policy.sh

      - name: Bind approval to exact reviewed values
        shell: bash
        env:
          GENERATION: ${{ needs.predecessor.outputs.generation }}
          PREVIOUS_GENERATION: ${{ needs.predecessor.outputs.previous_generation }}
          AUTHORITY_COMMIT: ${{ fromJSON(inputs.approval_record).authority_commit }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
          AUTHORITY_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
          SHIPPER_SHA256: ${{ fromJSON(inputs.approval_record).shipper_sha256 }}
          VERIFIER_SHA256: ${{ fromJSON(inputs.approval_record).verifier_sha256 }}
          PROVISIONER_SHA256: ${{ fromJSON(inputs.approval_record).provisioner_sha256 }}
          PRODUCTION_CONTRACT_SHA256: ${{ fromJSON(inputs.approval_record).production_contract_sha256 }}
          PROMOTION_RECOVERY_SHA256: ${{ fromJSON(inputs.approval_record).promotion_recovery_sha256 }}
        run: |
          set -euo pipefail
          {
            printf 'Approved exact V2 generation %s after %s\n' \
              "$GENERATION" "$PREVIOUS_GENERATION"
            printf 'source=%s tree=%s\n' "$AUTHORITY_COMMIT" "$AUTHORITY_TREE_SHA256"
            printf 'verification_policy_revision=%s\n' \
              "$VERIFICATION_POLICY_REVISION"
            printf 'shipper=%s verifier=%s provisioner=%s\n' \
              "$SHIPPER_SHA256" "$VERIFIER_SHA256" "$PROVISIONER_SHA256"
            printf 'production_contract=%s promotion_recovery=%s\n' \
              "$PRODUCTION_CONTRACT_SHA256" "$PROMOTION_RECOVERY_SHA256"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  sign:
    needs:
      - predecessor
      - source_metadata
      - compare_builds
      - approval_policy
    if: needs.predecessor.outputs.already_published != 'true' && needs.predecessor.outputs.target_already_published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout exact public verification helpers
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Download approved candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: reviewed-authority-candidate-run-${{ github.run_id }}-attempt-*
          path: reviewed-candidate-artifacts

      - name: Select newest immutable reviewed candidate from this run
        shell: bash
        run: |
          set -euo pipefail
          selected=$(find reviewed-candidate-artifacts \
            -mindepth 1 -maxdepth 1 -type d \
            -name "reviewed-authority-candidate-run-${GITHUB_RUN_ID}-attempt-*" \
            -printf '%f\n' | sort -V | sed -n '$p')
          if [[ -n $selected ]]; then
            test -z "$(find reviewed-candidate-artifacts \
              -mindepth 1 -maxdepth 1 ! -type d -print -quit)"
            mv "reviewed-candidate-artifacts/$selected" candidate
          else
            test -z "$(find reviewed-candidate-artifacts \
              -mindepth 1 -maxdepth 1 -type d -print -quit)"
            mv reviewed-candidate-artifacts candidate
          fi

      - name: Reconstruct and validate exact approved manifest without execution
        shell: bash
        env:
          AUTHORITY_GENERATION: ${{ needs.predecessor.outputs.generation }}
          PREVIOUS_AUTHORITY_GENERATION: ${{ needs.predecessor.outputs.previous_generation }}
          PREVIOUS_AUTHORITY_MANIFEST_SHA256: ${{ needs.predecessor.outputs.previous_manifest_sha256 }}
          AUTHORITY_VERSION: ${{ fromJSON(inputs.approval_record).authority_version }}
          AUTHORITY_COMMIT: ${{ fromJSON(inputs.approval_record).authority_commit }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
          AUTHORITY_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
          EXPECTED_SHIPPER_SHA256: ${{ fromJSON(inputs.approval_record).shipper_sha256 }}
          EXPECTED_VERIFIER_SHA256: ${{ fromJSON(inputs.approval_record).verifier_sha256 }}
          EXPECTED_PROVISIONER_SHA256: ${{ fromJSON(inputs.approval_record).provisioner_sha256 }}
          PRODUCTION_CONTRACT_SHA256: ${{ fromJSON(inputs.approval_record).production_contract_sha256 }}
          PRODUCTION_MEMBER_COUNT: ${{ fromJSON(inputs.approval_record).production_member_count }}
          RECEIPT_SCHEMA: ${{ fromJSON(inputs.approval_record).receipt_schema }}
          BUILD_AUTHORITY_SCHEMA: ${{ fromJSON(inputs.approval_record).build_authority_schema }}
          PROMOTION_RECOVERY_SCHEMA: ${{ fromJSON(inputs.approval_record).promotion_recovery_schema }}
          PROMOTION_RECOVERY_SHA256: ${{ fromJSON(inputs.approval_record).promotion_recovery_sha256 }}
          BASELINE_PROFILE: ${{ fromJSON(inputs.approval_record).baseline_profile }}
          BASELINE_GENERATION: ${{ fromJSON(inputs.approval_record).baseline_generation }}
          BASELINE_TREE_SHA256: ${{ fromJSON(inputs.approval_record).baseline_tree_sha256 }}
          BROWSER_BUNDLE_SHA256: ${{ fromJSON(inputs.approval_record).browser_bundle_sha256 }}
          BROWSER_VERSION: ${{ fromJSON(inputs.approval_record).browser_version }}
          BROWSER_LAUNCH_PROFILE_SHA256: ${{ fromJSON(inputs.approval_record).browser_launch_profile_sha256 }}
          VERIFIER_SCHEMA: ${{ fromJSON(inputs.approval_record).verifier_schema }}
        run: |
          set -euo pipefail
          SHIPPER_SHA256=$(jq -er '.shipper_sha256' candidate/build-metadata.json)
          VERIFIER_SHA256=$(jq -er '.verifier_sha256' candidate/build-metadata.json)
          PROVISIONER_SHA256=$(jq -er '.provisioner_sha256' candidate/build-metadata.json)
          VERIFIER_TOOLCHAIN_ID=$(jq -er '.verifier_toolchain_id' candidate/build-metadata.json)
          VERIFIER_CARGO_SHA256=$(jq -er '.verifier_cargo_sha256' candidate/build-metadata.json)
          VERIFIER_RUSTC_SHA256=$(jq -er '.verifier_rustc_sha256' candidate/build-metadata.json)
          VERIFIER_RUSTDOC_SHA256=$(jq -er '.verifier_rustdoc_sha256' candidate/build-metadata.json)
          test "$SHIPPER_SHA256" = "$EXPECTED_SHIPPER_SHA256"
          test "$VERIFIER_SHA256" = "$EXPECTED_VERIFIER_SHA256"
          test "$PROVISIONER_SHA256" = "$EXPECTED_PROVISIONER_SHA256"
          export SHIPPER_SHA256 VERIFIER_SHA256 PROVISIONER_SHA256
          export VERIFIER_TOOLCHAIN_ID VERIFIER_CARGO_SHA256
          export VERIFIER_RUSTC_SHA256 VERIFIER_RUSTDOC_SHA256
          export GITHUB_SHA
          bash public-workflow/scripts/release-authority-manifest.sh \
            render-v2 "$RUNNER_TEMP/release-authority-v2.json"
          cmp "$RUNNER_TEMP/release-authority-v2.json" candidate/review-manifest.json
          bash public-workflow/scripts/release-authority-manifest.sh validate \
            "$RUNNER_TEMP/release-authority-v2.json" \
            2 \
            "$AUTHORITY_GENERATION" \
            "$GITHUB_SHA" \
            candidate
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-protocol \
            candidate/authority-protocol.json \
            "$RUNNER_TEMP/release-authority-v2.json"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-shipper-self-test \
            candidate/shipper-self-test.json \
            "$RUNNER_TEMP/release-authority-v2.json"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-verifier-self-test \
            candidate/verifier-self-test.json \
            "$RUNNER_TEMP/release-authority-v2.json"

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Sign only the approved canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/release-authority-v2.json.cosign.bundle" \
            "$RUNNER_TEMP/release-authority-v2.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/release-authority-v2.json.cosign.bundle" \
            --certificate-identity \
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$RUNNER_TEMP/release-authority-v2.json"
          signed="$RUNNER_TEMP/signed-authority"
          mkdir -m 0700 "$signed"
          install -m 0400 \
            "$RUNNER_TEMP/release-authority-v2.json" \
            "$signed/release-authority-v2.json"
          install -m 0400 \
            "$RUNNER_TEMP/release-authority-v2.json.cosign.bundle" \
            "$signed/release-authority-v2.json.cosign.bundle"
          install -m 0500 \
            candidate/syntaur-build-authority-provision \
            candidate/syntaur-ship-linux-x86_64 \
            candidate/syntaur-verify-linux-x86_64 \
            "$signed/"
          chmod 0500 "$signed"

      - name: Upload signed authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-authority-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-authority
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  resolution_policy:
    needs: predecessor
    if: needs.predecessor.outputs.target_already_published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-authority
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed resolution policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Require exact independent environment policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNTAUR_RELEASE_AUTHORITY_ADMIN_READ_TOKEN }}
        run: bash public-workflow/scripts/verify-release-authority-policy.sh

      - name: Approve exact checked-in replacement selection review
        shell: bash
        env:
          GENERATION: ${{ needs.predecessor.outputs.generation }}
          PREVIOUS_GENERATION: ${{ needs.predecessor.outputs.previous_generation }}
          PREVIOUS_MANIFEST_SHA256: ${{ needs.predecessor.outputs.previous_manifest_sha256 }}
          REJECTED_AUTHORITY_MANIFEST_SHA256: ${{ fromJSON(inputs.approval_record).rejected_manifest_sha256 }}
          REJECTED_AUTHORITY_WORKFLOW_COMMIT: ${{ fromJSON(inputs.approval_record).rejected_workflow_commit }}
          SETTLED_PRODUCT_VERSION: ${{ fromJSON(inputs.approval_record).settled_product_version }}
          SETTLED_PRODUCT_GATEWAY_COMMIT: ${{ fromJSON(inputs.approval_record).settled_product_gateway_commit }}
          SETTLED_PRODUCT_ENGINE_COMMIT: ${{ fromJSON(inputs.approval_record).settled_product_engine_commit }}
          SETTLED_PRODUCT_STATE_SHA256: ${{ fromJSON(inputs.approval_record).settled_product_state_sha256 }}
          SETTLED_PROMOTION_POLICY_SHA256: ${{ fromJSON(inputs.approval_record).settled_promotion_policy_sha256 }}
          SELECTED_ENGINE_COMMIT: ${{ fromJSON(inputs.approval_record).selected_engine_commit }}
          PLANNED_PRODUCT_VERSION: ${{ fromJSON(inputs.approval_record).planned_product_version }}
          PLANNED_PRODUCT_BASE_COMMIT: ${{ fromJSON(inputs.approval_record).planned_product_base_commit }}
          RESOLUTION_REVISION: ${{ inputs.resolution_revision }}
        run: |
          set -euo pipefail
          review="public-workflow/.github/authority-replacement-reviews/g${GENERATION}.json"
          test -f "$review" && test ! -L "$review"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-selection-review "$review"
          test "$(jq -er '.predecessor_generation' "$review")" = "$PREVIOUS_GENERATION"
          test "$(jq -er '.predecessor_manifest_sha256' "$review")" \
            = "$PREVIOUS_MANIFEST_SHA256"
          test "$(jq -er '.rejected_generation' "$review")" = "$GENERATION"
          test "$(jq -er '.rejected_manifest_sha256' "$review")" \
            = "$REJECTED_AUTHORITY_MANIFEST_SHA256"
          test "$(jq -er '.rejected_workflow_commit' "$review")" \
            = "$REJECTED_AUTHORITY_WORKFLOW_COMMIT"
          test "$(jq -er '.selected_generation' "$review")" = "$GENERATION"
          test "$(jq -er '.settled_product_version' "$review")" \
            = "$SETTLED_PRODUCT_VERSION"
          test "$(jq -er '.settled_product_gateway_commit' "$review")" \
            = "$SETTLED_PRODUCT_GATEWAY_COMMIT"
          test "$(jq -er '.settled_product_engine_commit' "$review")" \
            = "$SETTLED_PRODUCT_ENGINE_COMMIT"
          test "$(jq -er '.settled_product_state_sha256' "$review")" \
            = "$SETTLED_PRODUCT_STATE_SHA256"
          test "$(jq -er '.settled_promotion_policy_sha256' "$review")" \
            = "$SETTLED_PROMOTION_POLICY_SHA256"
          test "$(jq -er '.selected_engine_commit' "$review")" \
            = "$SELECTED_ENGINE_COMMIT"
          test "$(jq -er '.planned_product_version' "$review")" \
            = "$PLANNED_PRODUCT_VERSION"
          test "$(jq -er '.planned_product_base_commit' "$review")" \
            = "$PLANNED_PRODUCT_BASE_COMMIT"
          test "$(jq -er '.resolution_workflow_commit // empty' "$review")" = ''
          test "$(jq -er '.rejected_workflow_commit' "$review")" != \
            "$(jq -er '.selected_workflow_commit' "$review")"
          test "$(jq -er '.rejected_workflow_commit' "$review")" != "$GITHUB_SHA"
          test "$(jq -er '.selected_workflow_commit' "$review")" != "$GITHUB_SHA"
          if [[ $RESOLUTION_REVISION != 1 ]]; then
            correction="public-workflow/.github/authority-resolution-corrections/g${GENERATION}-r${RESOLUTION_REVISION}.json"
            test -f "$correction" && test ! -L "$correction"
            bash public-workflow/scripts/release-authority-manifest.sh \
              validate-resolution-correction-review "$correction"
            test "$(jq -er '.generation' "$correction")" = "$GENERATION"
            test "$(jq -er '.resolution_revision' "$correction")" \
              = "$RESOLUTION_REVISION"
            test "$(jq -er '.selected_manifest_sha256' "$correction")" \
              = "$(jq -er '.selected_manifest_sha256' "$review")"
          fi
          {
            printf 'Approved checked-in replacement selection review\n'
            printf 'generation=%s revision=%s review_sha256=%s resolution_commit=%s\n' \
              "$GENERATION" "$RESOLUTION_REVISION" \
              "$(sha256sum "$review" | awk '{print $1}')" "$GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  replacement_proof_helper:
    needs:
      - predecessor
      - resolution_policy
      - source_metadata
    if: needs.predecessor.outputs.target_already_published == 'true' && inputs.resolution_revision == '3'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-authority-source
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact public proof-helper policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Download encrypted proof-helper source export
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: encrypted-authority-source-run-${{ github.run_id }}-attempt-*
          path: encrypted-source-artifacts

      - name: Select exact encrypted proof-helper source export
        shell: bash
        run: |
          set -euo pipefail
          selected=$(find encrypted-source-artifacts \
            -mindepth 1 -maxdepth 1 -type d \
            -name "encrypted-authority-source-run-${GITHUB_RUN_ID}-attempt-*" \
            -printf '%f\n' | sort -V | sed -n '$p')
          if [[ -n $selected ]]; then
            test -z "$(find encrypted-source-artifacts \
              -mindepth 1 -maxdepth 1 ! -type d -print -quit)"
            mv "encrypted-source-artifacts/$selected" encrypted-source
          else
            test -z "$(find encrypted-source-artifacts \
              -mindepth 1 -maxdepth 1 -type d -print -quit)"
            mv encrypted-source-artifacts encrypted-source
          fi

      - name: Decrypt exact proof-helper source with step-scoped identity
        shell: bash
        env:
          SOURCE_ARCHIVE_AGE_IDENTITY: ${{ secrets.SYNTAUR_SOURCE_ARCHIVE_AGE_IDENTITY }}
          SOURCE_COMMIT: ${{ needs.source_metadata.outputs.source_commit }}
          SOURCE_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
          SOURCE_DATE_EPOCH: ${{ needs.source_metadata.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          expected_names=$(printf '%s\n' source-export.json source.tar.age \
            | LC_ALL=C sort)
          actual_names=$(find encrypted-source -mindepth 1 -maxdepth 1 \
            -type f -printf '%f\n' | LC_ALL=C sort)
          test "$actual_names" = "$expected_names"
          test "$(jq -er '.schema' encrypted-source/source-export.json)" = 1
          test "$(jq -er '.authority_commit' encrypted-source/source-export.json)" \
            = "$SOURCE_COMMIT"
          test "$(jq -er '.authority_tree_sha256' \
            encrypted-source/source-export.json)" = "$SOURCE_TREE_SHA256"
          test "$(jq -er '.source_date_epoch' encrypted-source/source-export.json)" \
            = "$SOURCE_DATE_EPOCH"
          test "$(jq -er '.recipient' encrypted-source/source-export.json)" \
            = "$SOURCE_ARCHIVE_AGE_RECIPIENT"
          test "$(sha256sum encrypted-source/source.tar.age | awk '{print $1}')" \
            = "$(jq -er '.ciphertext_sha256' encrypted-source/source-export.json)"

          age_root="$RUNNER_TEMP/age"
          mkdir -m 0700 "$age_root"
          /usr/bin/curl -fsSLo "$age_root/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' \
            "$AGE_LINUX_AMD64_SHA256" "$age_root/age.tar.gz" \
            | sha256sum -c - >/dev/null
          tar -xzf "$age_root/age.tar.gz" -C "$age_root"
          mkdir -m 0700 "$age_root/bin"
          install -m 0500 \
            "$age_root/age/age" "$age_root/age/age-keygen" \
            "$age_root/bin/"
          derived_recipient=$(printf '%s\n' "$SOURCE_ARCHIVE_AGE_IDENTITY" \
            | "$age_root/bin/age-keygen" -y -)
          test "$derived_recipient" = "$SOURCE_ARCHIVE_AGE_RECIPIENT"
          source_archive="$RUNNER_TEMP/source.tar"
          printf '%s\n' "$SOURCE_ARCHIVE_AGE_IDENTITY" \
            | "$age_root/bin/age" \
                --decrypt \
                --identity - \
                --output "$source_archive" \
                encrypted-source/source.tar.age
          unset SOURCE_ARCHIVE_AGE_IDENTITY
          test "$(sha256sum "$source_archive" | awk '{print $1}')" \
            = "$(jq -er '.source_archive_sha256' \
                encrypted-source/source-export.json)"
          test "$(tar -tf "$source_archive" | sed -n '1p')" = source/
          if tar -tf "$source_archive" \
            | grep -Ev '^source(/|$)' >/dev/null; then
            exit 1
          fi
          tar \
            --extract \
            --file "$source_archive" \
            --directory "$GITHUB_WORKSPACE" \
            --no-same-owner \
            --no-same-permissions
          rm -f "$source_archive"
          rm -rf "$age_root"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$SOURCE_DATE_EPOCH" >>"$GITHUB_ENV"

      - name: Prove plaintext proof-helper source has no credential authority
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.source_metadata.outputs.source_commit }}
          SOURCE_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
          GENERATION: ${{ needs.predecessor.outputs.generation }}
        run: |
          set -euo pipefail
          correction="public-workflow/.github/authority-resolution-corrections/g${GENERATION}-r3.json"
          test -z "${SOURCE_ARCHIVE_AGE_IDENTITY:-}"
          test -z "${SYNTAUR_SOURCE_DEPLOY_KEY:-}"
          leaked_identities=$(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" \
            -type f -size -128k -print0 \
            | xargs -0 -r grep -Il \
                -e '^AGE-SECRET-KEY-' \
                -e '^-----BEGIN OPENSSH PRIVATE KEY-----$' || true)
          test -z "$leaked_identities"
          test -z "$(git -C source config --local --get-all core.sshCommand || true)"
          test -z "$(git -C source config --local \
            --get-all http.https://github.com/.extraheader || true)"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C source rev-list --parents -n 1 HEAD | awk '{print NF}')" = 2
          test "$(git -C source rev-parse HEAD^)" \
            = "$(jq -er '.superseded_planned_product_base_commit' "$correction")"
          test "$(bash public-workflow/scripts/release-authority-manifest.sh \
            source-tree-sha256 source "$SOURCE_COMMIT")" = "$SOURCE_TREE_SHA256"
          test "$(<source/VERSION)" = 0.7.163
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          test -z "$(find source -type l -print -quit)"
          test -z "$(find source -type f -links +1 -print -quit)"
          test "$(git -C source show -s --format=%ct "$SOURCE_COMMIT")" \
            = "${SOURCE_DATE_EPOCH}"
          sudo chown -R 65534:65534 source

      - name: Prepare pinned proof-helper builder
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/proof-helper-builder-context"
          mkdir -m 0700 "$context"
          {
            printf 'FROM %s\n' "$AUTHORITY_BUILDER_IMAGE"
            cat <<'EOF'
          RUN rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources \
              && printf '%s\n' \
                'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260727T000000Z bookworm main' \
                'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260727T000000Z bookworm-updates main' \
                > /etc/apt/sources.list \
              && apt-get -o Acquire::Check-Valid-Until=false update \
              && apt-get install -y --no-install-recommends \
                ca-certificates git libdbus-1-dev passwd pkg-config \
              && useradd --uid 10001 --create-home --shell /usr/sbin/nologin proof \
              && rm -rf /var/lib/apt/lists/*
          EOF
          } >"$context/Dockerfile"
          docker pull "$AUTHORITY_BUILDER_IMAGE"
          docker build --pull=false --file "$context/Dockerfile" \
            --tag syntaur-r3-proof-helper-builder "$context"

      - name: Fetch locked dependencies without candidate execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0755 "$RUNNER_TEMP/proof-cargo"
          sudo chown 65534:65534 "$RUNNER_TEMP/proof-cargo"
          docker run --rm \
            --network bridge \
            --read-only \
            --user 65534:65534 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/source,dst=/source,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/proof-cargo,dst=/cargo" \
            --workdir /tmp \
            --env CARGO_HOME=/cargo \
            --env CARGO_NET_GIT_FETCH_WITH_CLI=false \
            --env CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse \
            syntaur-r3-proof-helper-builder \
            /usr/bin/bash --noprofile --norc -ceu '
              cargo fetch \
                --config "registry.global-credential-providers=[]" \
                --config "net.git-fetch-with-cli=false" \
                --manifest-path /source/Cargo.toml \
                --locked --target x86_64-unknown-linux-gnu \
                >/tmp/cargo-fetch.log 2>&1
            '

      - name: Build twice and byte-compare exact source
        shell: bash
        run: |
          set -euo pipefail
          for build in a b; do
            target="$RUNNER_TEMP/proof-target-$build"
            mkdir -m 0755 "$target"
            sudo chown 65534:65534 "$target"
            docker run --rm \
              --network none \
              --read-only \
              --user 65534:65534 \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 1024 \
              --memory 14g \
              --cpus 4 \
              --tmpfs /tmp:rw,nosuid,nodev,size=4g \
              --mount "type=bind,src=${GITHUB_WORKSPACE}/source,dst=/source,readonly" \
              --mount "type=bind,src=${RUNNER_TEMP}/proof-cargo,dst=/cargo" \
              --mount "type=bind,src=${target},dst=/target" \
              --workdir /source \
              --env HOME=/tmp/home \
              --env CARGO_HOME=/cargo \
              --env CARGO_TARGET_DIR=/target \
              --env CARGO_INCREMENTAL=0 \
              --env CARGO_NET_OFFLINE=true \
              --env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              --env GIT_CONFIG_COUNT=1 \
              --env GIT_CONFIG_KEY_0=safe.directory \
              --env GIT_CONFIG_VALUE_0=/source \
              syntaur-r3-proof-helper-builder \
              /usr/bin/bash --noprofile --norc -ceu '
                cargo build --release --frozen --offline \
                  --target x86_64-unknown-linux-gnu -p syntaur-ship \
                  >/tmp/proof-helper-build.log 2>&1
                install --mode=0555 \
                  /target/x86_64-unknown-linux-gnu/release/syntaur-ship \
                  /target/syntaur-authority-replacement-proof-linux-x86_64
                test "$(stat -c %h \
                  /target/syntaur-authority-replacement-proof-linux-x86_64)" = 1
                /target/syntaur-authority-replacement-proof-linux-x86_64 \
                  authority-replacement-proof-helper-build-attestation \
                  > /target/proof-helper-build-attestation.json
              '
          done
          helper_a="$RUNNER_TEMP/proof-target-a/syntaur-authority-replacement-proof-linux-x86_64"
          helper_b="$RUNNER_TEMP/proof-target-b/syntaur-authority-replacement-proof-linux-x86_64"
          cmp "$helper_a" "$helper_b"
          cmp "$RUNNER_TEMP/proof-target-a/proof-helper-build-attestation.json" \
            "$RUNNER_TEMP/proof-target-b/proof-helper-build-attestation.json"

      - name: Execute real nonroot and adversarial path probes
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/proof-target-a"
          docker run --rm \
            --network none \
            --read-only \
            --user 65534:65534 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 1024 \
            --memory 14g \
            --cpus 4 \
            --tmpfs /tmp:rw,nosuid,nodev,size=4g \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/source,dst=/source,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/proof-cargo,dst=/cargo" \
            --mount "type=bind,src=${target},dst=/target" \
            --workdir /source \
            --env HOME=/tmp/home \
            --env CARGO_HOME=/cargo \
            --env CARGO_TARGET_DIR=/target \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_NET_OFFLINE=true \
            --env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/source \
            syntaur-r3-proof-helper-builder \
            /usr/bin/bash --noprofile --norc -ceu '
              cargo test --frozen --offline \
                --target x86_64-unknown-linux-gnu \
                -p syntaur-ship --no-run --message-format=json \
                > /target/proof-helper-tests.jsons
            '
          mapfile -t test_bins < <(jq -r \
            'select(.reason == "compiler-artifact" and
                    .profile.test == true and
                    .target.name == "syntaur-ship" and
                    .executable != null) |
             .executable' "$target/proof-helper-tests.jsons" | sort -u)
          test "${#test_bins[@]}" = 1
          test_bin=${test_bins[0]#/target/}
          fixture=authority::tests::replacement_product_state_identity_subprocess_fixture
          docker run --rm \
            --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=${target},dst=/target,readonly" \
            --env HOME=/home/proof --env USER=proof --env LOGNAME=proof \
            --env AUTHORITY_REPLACEMENT_TEST_CHILD=nonroot \
            syntaur-r3-proof-helper-builder \
            "/target/$test_bin" --exact "$fixture" --ignored --nocapture
          docker run --rm \
            --network none --read-only --user 0:0 \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=${target},dst=/target,readonly" \
            --env HOME=/root --env USER=root --env LOGNAME=root \
            --env SUDO_UID=10001 --env SUDO_GID=10001 --env SUDO_USER=proof \
            --env AUTHORITY_REPLACEMENT_TEST_CHILD=root \
            syntaur-r3-proof-helper-builder \
            "/target/$test_bin" --exact "$fixture" --ignored --nocapture
          helper="$RUNNER_TEMP/proof-target-a/syntaur-authority-replacement-proof-linux-x86_64"
          "$helper" authority-replacement-proof-helper-build-attestation \
            >"$RUNNER_TEMP/nonroot-proof-helper-attestation.json"
          if "$helper" authority-replacement-product-state-helper; then
            printf 'proof helper accepted a non-fixed execution path\n' >&2
            exit 1
          fi
          if sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/root USER=root LOGNAME=root \
            "$helper" authority-replacement-proof-helper-build-attestation; then
            printf 'proof-helper attestation accepted a privileged entry\n' >&2
            exit 1
          fi
          cmp "$RUNNER_TEMP/nonroot-proof-helper-attestation.json" \
            "$RUNNER_TEMP/proof-target-a/proof-helper-build-attestation.json"

      - name: Bind and package exact proof helper
        shell: bash
        env:
          GENERATION: ${{ needs.predecessor.outputs.generation }}
          SOURCE_COMMIT: ${{ needs.source_metadata.outputs.source_commit }}
          SOURCE_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
        run: |
          set -euo pipefail
          correction="public-workflow/.github/authority-resolution-corrections/g${GENERATION}-r3.json"
          helper="$RUNNER_TEMP/proof-target-a/syntaur-authority-replacement-proof-linux-x86_64"
          attestation="$RUNNER_TEMP/proof-target-a/proof-helper-build-attestation.json"
          jq -e '
            (.schema == 1) and
            ((keys | sort) == ([
              "build_clean", "build_profile", "build_target",
              "control_plane_sha256", "executable_sha256",
              "protocol_sha256", "rustflags_sha256", "schema",
              "source_commit", "toolchain_sha256"
            ] | sort))
          ' "$attestation" >/dev/null
          test "$(jq -er '.source_commit' "$attestation")" = "$SOURCE_COMMIT"
          test "$(jq -er '.executable_sha256' "$attestation")" \
            = "$(sha256sum "$helper" | awk '{print $1}')"
          test "$(jq -er '.executable_sha256' "$attestation")" \
            = "$(jq -er '.proof_helper_sha256' "$correction")"
          test "$SOURCE_TREE_SHA256" \
            = "$(jq -er '.proof_helper_source_tree_sha256' "$correction")"
          test "$(jq -er '.control_plane_sha256' "$attestation")" \
            = "$(jq -er '.proof_helper_control_plane_sha256' "$correction")"
          test "$(jq -er '.toolchain_sha256' "$attestation")" \
            = "$(jq -er '.proof_helper_toolchain_sha256' "$correction")"
          test "$(jq -er '.rustflags_sha256' "$attestation")" \
            = "$(jq -er '.proof_helper_rustflags_sha256' "$correction")"
          test "$(jq -er '.build_target' "$attestation")" \
            = "$(jq -er '.proof_helper_build_target' "$correction")"
          test "$(jq -er '.build_profile' "$attestation")" \
            = "$(jq -er '.proof_helper_build_profile' "$correction")"
          test "$(jq -er '.build_clean' "$attestation")" \
            = "$(jq -er '.proof_helper_build_clean' "$correction")"
          test "$(jq -er '.protocol_sha256' "$attestation")" \
            = "$(jq -er '.proof_helper_protocol_sha256' "$correction")"
          test "$(jq -er '.protocol_sha256' "$attestation")" \
            = "$(jq -er '.proof_helper_subprocess_protocol_sha256' "$correction")"
          package="$RUNNER_TEMP/replacement-proof-helper"
          mkdir -m 0700 "$package"
          install -m 0500 "$helper" \
            "$package/syntaur-authority-replacement-proof-linux-x86_64"
          install -m 0400 "$attestation" \
            "$package/proof-helper-build-attestation.json"
          chmod 0500 "$package"

      - name: Upload source-free replacement proof helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: replacement-proof-helper-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/replacement-proof-helper
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  recover_sign_resolution:
    needs:
      - predecessor
      - resolution_policy
      - replacement_proof_helper
    if: >-
      always() &&
      needs.predecessor.outputs.target_already_published == 'true' &&
      needs.resolution_policy.result == 'success' &&
      (inputs.resolution_revision != '3' ||
       needs.replacement_proof_helper.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - name: Checkout exact approved recovery helpers and review
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Download exact replacement proof helper
        if: inputs.resolution_revision == '3'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: replacement-proof-helper-run-${{ github.run_id }}-attempt-*
          path: replacement-proof-helper-artifacts

      - name: Select exact replacement proof helper
        if: inputs.resolution_revision == '3'
        shell: bash
        run: |
          set -euo pipefail
          selected=$(find replacement-proof-helper-artifacts \
            -mindepth 1 -maxdepth 1 -type d \
            -name "replacement-proof-helper-run-${GITHUB_RUN_ID}-attempt-*" \
            -printf '%f\n' | sort -V | sed -n '$p')
          if [[ -n $selected ]]; then
            test -z "$(find replacement-proof-helper-artifacts \
              -mindepth 1 -maxdepth 1 ! -type d -print -quit)"
            mv "replacement-proof-helper-artifacts/$selected" replacement-proof-helper
          else
            test -z "$(find replacement-proof-helper-artifacts \
              -mindepth 1 -maxdepth 1 -type d -print -quit)"
            mv replacement-proof-helper-artifacts replacement-proof-helper
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Recover or sign only the missing replacement resolution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION: ${{ needs.predecessor.outputs.generation }}
          PREVIOUS_GENERATION: ${{ needs.predecessor.outputs.previous_generation }}
          PREVIOUS_MANIFEST_SHA256: ${{ needs.predecessor.outputs.previous_manifest_sha256 }}
          TARGET_TAG: ${{ needs.predecessor.outputs.target_tag }}
          RESOLUTION_REVISION: ${{ inputs.resolution_revision }}
        run: |
          set -euo pipefail
          review="public-workflow/.github/authority-replacement-reviews/g${GENERATION}.json"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-selection-review "$review"
          REJECTED_AUTHORITY_GENERATION=$(jq -er '.rejected_generation' "$review")
          REJECTED_AUTHORITY_MANIFEST_SHA256=$(jq -er '.rejected_manifest_sha256' "$review")
          REJECTED_AUTHORITY_WORKFLOW_COMMIT=$(jq -er '.rejected_workflow_commit' "$review")
          REJECTED_AUTHORITY_VERSION=$(jq -er '.rejected_authority_version' "$review")
          REJECTED_AUTHORITY_COMMIT=$(jq -er '.rejected_authority_commit' "$review")
          REJECTED_PRODUCT_RELEASE_COMMIT=$(jq -er '.rejected_product_release_commit' "$review")
          SETTLED_PRODUCT_VERSION=$(jq -er '.settled_product_version' "$review")
          SETTLED_PRODUCT_GATEWAY_COMMIT=$(jq -er '.settled_product_gateway_commit' "$review")
          SETTLED_PRODUCT_ENGINE_COMMIT=$(jq -er '.settled_product_engine_commit' "$review")
          SETTLED_PRODUCT_STATE_SHA256=$(jq -er '.settled_product_state_sha256' "$review")
          SETTLED_PROMOTION_POLICY_SHA256=$(jq -er '.settled_promotion_policy_sha256' "$review")
          SELECTED_ENGINE_COMMIT=$(jq -er '.selected_engine_commit' "$review")
          PLANNED_PRODUCT_VERSION=$(jq -er '.planned_product_version' "$review")
          PLANNED_PRODUCT_BASE_COMMIT=$(jq -er '.planned_product_base_commit' "$review")
          target="$RUNNER_TEMP/selected-authority"
          mkdir -m 0700 "$target"
          gh release download "$TARGET_TAG" \
            --repo "$GITHUB_REPOSITORY" --dir "$target"
          target_release=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}")
          test "$(jq -r '.draft' <<<"$target_release")" = false
          test "$(jq -r '.prerelease' <<<"$target_release")" = false
          test "$(jq -r '.immutable' <<<"$target_release")" = true
          gh release verify "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          while IFS= read -r asset; do
            gh release verify-asset "$TARGET_TAG" "$target/$asset" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
          done < <(jq -r '.assets[].name' <<<"$target_release")
          target_manifest="$target/release-authority-v2.json"
          selected_workflow_commit=$(jq -er '.workflow_commit' "$target_manifest")
          bash public-workflow/scripts/release-authority-manifest.sh validate \
            "$target_manifest" 2 "$GENERATION" "$selected_workflow_commit" "$target"
          cosign verify-blob \
            --bundle "$target/release-authority-v2.json.cosign.bundle" \
            --certificate-identity \
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$selected_workflow_commit" \
            "$target_manifest"
          test "$(jq -er '.predecessor_generation' "$review")" = "$PREVIOUS_GENERATION"
          test "$(jq -er '.predecessor_manifest_sha256' "$review")" \
            = "$PREVIOUS_MANIFEST_SHA256"
          test "$(jq -er '.selected_generation' "$review")" = "$GENERATION"
          test "$(jq -er '.selected_tag' "$review")" = "$TARGET_TAG"
          test "$(jq -er '.selected_manifest_sha256' "$review")" \
            = "$(sha256sum "$target_manifest" | awk '{print $1}')"
          test "$(jq -er '.selected_workflow_commit' "$review")" \
            = "$selected_workflow_commit"
          test "$(jq -er '.selected_authority_version' "$review")" \
            = "$(jq -er '.authority_version' "$target_manifest")"
          test "$(jq -er '.selected_authority_commit' "$review")" \
            = "$(jq -er '.authority_commit' "$target_manifest")"
          test "$REJECTED_AUTHORITY_WORKFLOW_COMMIT" != "$selected_workflow_commit"
          test "$REJECTED_AUTHORITY_WORKFLOW_COMMIT" != "$GITHUB_SHA"
          test "$selected_workflow_commit" != "$GITHUB_SHA"

          resolution="$RUNNER_TEMP/signed-resolution"
          mkdir -m 0700 "$resolution"
          resolution_tag="authority-resolution-v1-g${GENERATION}"
          correction=
          supersedes_resolution_tag=
          supersedes_resolution_sha256=
          superseded_recovery_tool_sha256=
          correction_review_sha256=
          if [[ $RESOLUTION_REVISION != 1 ]]; then
            correction="public-workflow/.github/authority-resolution-corrections/g${GENERATION}-r${RESOLUTION_REVISION}.json"
            bash public-workflow/scripts/release-authority-manifest.sh \
              validate-resolution-correction-review "$correction"
            resolution_tag=$(jq -er '.resolution_tag' "$correction")
            supersedes_resolution_tag=$(jq -er '.supersedes_resolution_tag' "$correction")
            supersedes_resolution_sha256=$(jq -er '.supersedes_resolution_sha256' "$correction")
            superseded_recovery_tool_sha256=$(jq -er '.superseded_recovery_tool_sha256' "$correction")
            correction_review_sha256=$(sha256sum "$correction" | awk '{print $1}')
            test "$(jq -er '.selected_manifest_sha256' "$correction")" \
              = "$(sha256sum "$target_manifest" | awk '{print $1}')"
            if [[ $RESOLUTION_REVISION == 3 ]]; then
              proof_package=replacement-proof-helper
              proof_helper="$proof_package/syntaur-authority-replacement-proof-linux-x86_64"
              proof_attestation="$proof_package/proof-helper-build-attestation.json"
              proof_actual=$(find "$proof_package" -mindepth 1 -maxdepth 1 \
                -type f -printf '%f\n' | LC_ALL=C sort)
              proof_expected=$(printf '%s\n' \
                proof-helper-build-attestation.json \
                syntaur-authority-replacement-proof-linux-x86_64 \
                | LC_ALL=C sort)
              test "$proof_actual" = "$proof_expected"
              test -f "$proof_helper" && test ! -L "$proof_helper"
              test -f "$proof_attestation" && test ! -L "$proof_attestation"
              test "$(sha256sum "$proof_helper" | awk '{print $1}')" \
                = "$(jq -er '.proof_helper_sha256' "$correction")"
              test "$(jq -er '.source_commit' "$proof_attestation")" \
                = "$(jq -er '.proof_helper_source_commit' "$correction")"
              test "$(jq -er '.protocol_sha256' "$proof_attestation")" \
                = "$(jq -er '.proof_helper_protocol_sha256' "$correction")"
              PLANNED_PRODUCT_BASE_COMMIT=$(jq -er \
                '.corrected_planned_product_base_commit' "$correction")
              test "$PLANNED_PRODUCT_BASE_COMMIT" \
                = "$(jq -er '.proof_helper_source_commit' "$correction")"
            fi

            superseded="$RUNNER_TEMP/superseded-resolution"
            mkdir -m 0700 "$superseded"
            superseded_release=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/${supersedes_resolution_tag}")
            test "$(jq -r '.draft' <<<"$superseded_release")" = false
            test "$(jq -r '.prerelease' <<<"$superseded_release")" = false
            test "$(jq -r '.immutable' <<<"$superseded_release")" = true
            gh release download "$supersedes_resolution_tag" \
              --repo "$GITHUB_REPOSITORY" --dir "$superseded"
            gh release verify "$supersedes_resolution_tag" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
            while IFS= read -r asset; do
              gh release verify-asset "$supersedes_resolution_tag" "$superseded/$asset" \
                --repo "$GITHUB_REPOSITORY" >/dev/null
            done < <(jq -r '.assets[].name' <<<"$superseded_release")
            bash public-workflow/scripts/release-authority-manifest.sh \
              validate-replacement-resolution-assets "$superseded"
            superseded_record="$superseded/release-authority-replacement-v1.json"
            bash public-workflow/scripts/release-authority-manifest.sh \
              validate-replacement-resolution-tag \
              "$supersedes_resolution_tag" "$superseded_record"
            test "$(sha256sum "$superseded_record" | awk '{print $1}')" \
              = "$supersedes_resolution_sha256"
            test "$(sha256sum "$superseded/recover-release-authority-replacement-v1.sh" \
              | awk '{print $1}')" = "$superseded_recovery_tool_sha256"
            test "$(( $(jq -er '.resolution_revision // 1' "$superseded_record") + 1 ))" \
              = "$RESOLUTION_REVISION"
            test "$(jq -er '.selected_manifest_sha256' "$superseded_record")" \
              = "$(sha256sum "$target_manifest" | awk '{print $1}')"
            test "$(jq -er '.selected_workflow_commit' "$superseded_record")" \
              = "$selected_workflow_commit"
            superseded_workflow_commit=$(jq -er \
              '.resolution_workflow_commit' "$superseded_record")
            test "$superseded_workflow_commit" = \
              "$(jq -er '.superseded_resolution_workflow_commit' "$correction")"
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${supersedes_resolution_tag}" \
              --jq '.object.sha')" = "$superseded_workflow_commit"
            test "$(jq -er '.manifest_helper_sha256' "$superseded_record")" \
              = "$(jq -er '.superseded_manifest_helper_sha256' "$correction")"
            if [[ $RESOLUTION_REVISION == 3 ]]; then
              test "$(jq -er '.active_generation' "$correction")" = "$GENERATION"
              test "$(jq -er '.active_manifest_sha256' "$correction")" \
                = "$(sha256sum "$target_manifest" | awk '{print $1}')"
              test "$(jq -er '.sealed_inputs_resolution_sha256' "$correction")" \
                = "$supersedes_resolution_sha256"
              test "$(jq -er '.superseded_planned_product_base_commit' "$correction")" \
                = "$(jq -er '.planned_product_base_commit' "$superseded_record")"
            else
              test "$(jq -er '.active_generation' "$correction")" \
                = "$PREVIOUS_GENERATION"
              test "$(jq -er '.active_manifest_sha256' "$correction")" \
                = "$PREVIOUS_MANIFEST_SHA256"
            fi
            test "$(jq -er '.active_product_state_sha256' "$correction")" \
              = "$SETTLED_PRODUCT_STATE_SHA256"
            test "$(jq -er '.corrected_recovery_tool_sha256' "$correction")" \
              = "$(sha256sum public-workflow/scripts/recover-release-authority-replacement-v1.sh \
                | awk '{print $1}')"
            test "$(jq -er '.corrected_manifest_helper_sha256' "$correction")" \
              = "$(sha256sum public-workflow/scripts/release-authority-manifest.sh \
                | awk '{print $1}')"
            cosign verify-blob \
              --bundle "$superseded/release-authority-replacement-v1.json.cosign.bundle" \
              --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-sha "$superseded_workflow_commit" \
              "$superseded_record"
          fi
          inventory="$RUNNER_TEMP/resolution-inventory.jsons"
          matches="$RUNNER_TEMP/resolution-matches.jsons"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[]' >"$inventory"
          jq -c --arg tag "$resolution_tag" \
            'select(.tag_name == $tag)' "$inventory" >"$matches"
          match_count=$(jq -s 'length' "$matches")
          (( match_count <= 1 )) || { printf 'duplicate resolution releases\n' >&2; exit 1; }
          reuse_existing=false
          if (( match_count == 1 )); then
            existing_release=$(jq -s '.[0]' "$matches")
            while IFS=$'\t' read -r asset_id asset_name; do
              printf '%s' "$asset_name" | grep -Eq '^[A-Za-z0-9._-]+$'
              gh api \
                -H 'Accept: application/octet-stream' \
                "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                >"$resolution/$asset_name"
            done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<<"$existing_release")
            if bash public-workflow/scripts/release-authority-manifest.sh \
              validate-replacement-resolution-assets "$resolution"; then
              record="$resolution/release-authority-replacement-v1.json"
              bash public-workflow/scripts/release-authority-manifest.sh \
                validate-replacement-resolution-tag "$resolution_tag" "$record"
              resolution_workflow_commit=$(jq -er '.resolution_workflow_commit' "$record")
              if [[ $(jq -r '.draft' <<<"$existing_release") == true ]]; then
                test "$(jq -r '.target_commitish' <<<"$existing_release")" \
                  = "$resolution_workflow_commit"
              else
                test "$(jq -r '.prerelease' <<<"$existing_release")" = false
                test "$(jq -r '.immutable' <<<"$existing_release")" = true
                test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${resolution_tag}" \
                  --jq '.object.sha')" = "$resolution_workflow_commit"
              fi
              reuse_existing=true
            else
              test "$(jq -r '.draft' <<<"$existing_release")" = true
              resolution="$RUNNER_TEMP/signed-resolution-rebuilt"
              mkdir -m 0700 "$resolution"
            fi
          fi
          if [[ $reuse_existing != true ]]; then
            tag_file="$RUNNER_TEMP/resolution-tag.json"
            if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${resolution_tag}" \
              >"$tag_file" 2>"$RUNNER_TEMP/resolution-tag.error"; then
              printf 'orphan replacement-resolution tag exists\n' >&2
              exit 1
            fi
            grep -Eq '\(HTTP 404\)$' "$RUNNER_TEMP/resolution-tag.error"
            install -m 0500 \
              public-workflow/scripts/recover-release-authority-replacement-v1.sh \
              "$resolution/recover-release-authority-replacement-v1.sh"
            install -m 0500 \
              public-workflow/scripts/release-authority-manifest.sh \
              "$resolution/release-authority-manifest.sh"
            install -m 0400 "$review" \
              "$resolution/release-authority-selection-review-v1.json"
            if [[ $RESOLUTION_REVISION != 1 ]]; then
              install -m 0400 "$correction" \
                "$resolution/release-authority-resolution-correction-v1.json"
            fi
            if [[ $RESOLUTION_REVISION == 3 ]]; then
              install -m 0500 \
                "$proof_helper" \
                "$resolution/syntaur-authority-replacement-proof-linux-x86_64"
              PROOF_HELPER_SOURCE_COMMIT=$(jq -er \
                '.proof_helper_source_commit' "$correction")
              PROOF_HELPER_SOURCE_TREE_SHA256=$(jq -er \
                '.proof_helper_source_tree_sha256' "$correction")
              PROOF_HELPER_SHA256=$(jq -er '.proof_helper_sha256' "$correction")
              PROOF_HELPER_CONTROL_PLANE_SHA256=$(jq -er \
                '.proof_helper_control_plane_sha256' "$correction")
              PROOF_HELPER_TOOLCHAIN_SHA256=$(jq -er \
                '.proof_helper_toolchain_sha256' "$correction")
              PROOF_HELPER_RUSTFLAGS_SHA256=$(jq -er \
                '.proof_helper_rustflags_sha256' "$correction")
              PROOF_HELPER_BUILD_TARGET=$(jq -er \
                '.proof_helper_build_target' "$correction")
              PROOF_HELPER_BUILD_PROFILE=$(jq -er \
                '.proof_helper_build_profile' "$correction")
              PROOF_HELPER_BUILD_CLEAN=$(jq -er \
                '.proof_helper_build_clean' "$correction")
              PROOF_HELPER_EXECUTION_PATH=$(jq -er \
                '.proof_helper_execution_path' "$correction")
              PROOF_HELPER_PROTOCOL_SHA256=$(jq -er \
                '.proof_helper_protocol_sha256' "$correction")
            fi
            REPLACEMENT_PREDECESSOR_GENERATION=$PREVIOUS_GENERATION
            REPLACEMENT_PREDECESSOR_MANIFEST_SHA256=$PREVIOUS_MANIFEST_SHA256
            SELECTED_AUTHORITY_GENERATION=$GENERATION
            SELECTED_AUTHORITY_MANIFEST_SHA256=$(sha256sum "$target_manifest" | awk '{print $1}')
            SELECTED_AUTHORITY_WORKFLOW_COMMIT=$selected_workflow_commit
            SELECTED_AUTHORITY_VERSION=$(jq -er '.authority_version' "$target_manifest")
            SELECTED_AUTHORITY_COMMIT=$(jq -er '.authority_commit' "$target_manifest")
            RECOVERY_TOOL_SHA256=$(sha256sum \
              "$resolution/recover-release-authority-replacement-v1.sh" | awk '{print $1}')
            MANIFEST_HELPER_SHA256=$(sha256sum \
              "$resolution/release-authority-manifest.sh" | awk '{print $1}')
            SELECTION_REVIEW_SHA256=$(sha256sum \
              "$resolution/release-authority-selection-review-v1.json" | awk '{print $1}')
            RESOLUTION_WORKFLOW_COMMIT=$GITHUB_SHA
            SUPERSEDES_RESOLUTION_TAG=$supersedes_resolution_tag
            SUPERSEDES_RESOLUTION_SHA256=$supersedes_resolution_sha256
            SUPERSEDED_RECOVERY_TOOL_SHA256=$superseded_recovery_tool_sha256
            CORRECTION_REVIEW_SHA256=$correction_review_sha256
            export REPLACEMENT_PREDECESSOR_GENERATION
            export REPLACEMENT_PREDECESSOR_MANIFEST_SHA256
            export REJECTED_AUTHORITY_GENERATION REJECTED_AUTHORITY_MANIFEST_SHA256
            export REJECTED_AUTHORITY_WORKFLOW_COMMIT REJECTED_AUTHORITY_VERSION
            export REJECTED_AUTHORITY_COMMIT REJECTED_PRODUCT_RELEASE_COMMIT
            export SELECTED_AUTHORITY_GENERATION SELECTED_AUTHORITY_MANIFEST_SHA256
            export SELECTED_AUTHORITY_WORKFLOW_COMMIT SELECTED_AUTHORITY_VERSION
            export SELECTED_AUTHORITY_COMMIT RECOVERY_TOOL_SHA256
            export SETTLED_PRODUCT_VERSION SETTLED_PRODUCT_GATEWAY_COMMIT
            export SETTLED_PRODUCT_ENGINE_COMMIT SELECTED_ENGINE_COMMIT
            export SETTLED_PRODUCT_STATE_SHA256 SETTLED_PROMOTION_POLICY_SHA256
            export PLANNED_PRODUCT_VERSION PLANNED_PRODUCT_BASE_COMMIT
            export MANIFEST_HELPER_SHA256 SELECTION_REVIEW_SHA256
            export RESOLUTION_WORKFLOW_COMMIT RESOLUTION_REVISION
            export SUPERSEDES_RESOLUTION_TAG SUPERSEDES_RESOLUTION_SHA256
            export SUPERSEDED_RECOVERY_TOOL_SHA256 CORRECTION_REVIEW_SHA256
            if [[ $RESOLUTION_REVISION == 3 ]]; then
              export PROOF_HELPER_SOURCE_COMMIT PROOF_HELPER_SOURCE_TREE_SHA256
              export PROOF_HELPER_SHA256 PROOF_HELPER_CONTROL_PLANE_SHA256
              export PROOF_HELPER_TOOLCHAIN_SHA256 PROOF_HELPER_RUSTFLAGS_SHA256
              export PROOF_HELPER_BUILD_TARGET PROOF_HELPER_BUILD_PROFILE
              export PROOF_HELPER_BUILD_CLEAN PROOF_HELPER_EXECUTION_PATH
              export PROOF_HELPER_PROTOCOL_SHA256
            fi
            bash public-workflow/scripts/release-authority-manifest.sh \
              render-replacement-resolution \
              "$resolution/release-authority-replacement-v1.json"
            cosign sign-blob --yes \
              --bundle "$resolution/release-authority-replacement-v1.json.cosign.bundle" \
              "$resolution/release-authority-replacement-v1.json"
            record="$resolution/release-authority-replacement-v1.json"
            resolution_workflow_commit=$GITHUB_SHA
          fi
          test "$(jq -er '.predecessor_generation' "$record")" = "$PREVIOUS_GENERATION"
          test "$(jq -er '.predecessor_manifest_sha256' "$record")" \
            = "$PREVIOUS_MANIFEST_SHA256"
          # shellcheck disable=SC2153 # GitHub injects this exact env key.
          rejected_generation=$REJECTED_AUTHORITY_GENERATION
          # shellcheck disable=SC2153 # GitHub injects this exact env key.
          rejected_manifest_sha256=$REJECTED_AUTHORITY_MANIFEST_SHA256
          test "$(jq -er '.rejected_generation' "$record")" = "$rejected_generation"
          test "$(jq -er '.rejected_manifest_sha256' "$record")" \
            = "$rejected_manifest_sha256"
          test "$(jq -er '.selected_manifest_sha256' "$record")" \
            = "$(sha256sum "$target_manifest" | awk '{print $1}')"
          test "$(jq -er '.selected_workflow_commit' "$record")" \
            = "$selected_workflow_commit"
          test "$(jq -er '.selection_review_sha256' "$record")" \
            = "$(sha256sum "$review" | awk '{print $1}')"
          cmp "$review" "$resolution/release-authority-selection-review-v1.json"
          test "$(jq -er '.resolution_revision // 1' "$record")" \
            = "$RESOLUTION_REVISION"
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-replacement-resolution-tag "$resolution_tag" "$record"
          if [[ $RESOLUTION_REVISION != 1 ]]; then
            test "$(jq -er '.supersedes_resolution_tag' "$record")" \
              = "$supersedes_resolution_tag"
            test "$(jq -er '.supersedes_resolution_sha256' "$record")" \
              = "$supersedes_resolution_sha256"
            test "$(jq -er '.superseded_recovery_tool_sha256' "$record")" \
              = "$superseded_recovery_tool_sha256"
            test "$(jq -er '.correction_review_sha256' "$record")" \
              = "$correction_review_sha256"
            cmp "$correction" \
              "$resolution/release-authority-resolution-correction-v1.json"
            r3=false
            if [[ $RESOLUTION_REVISION == 3 ]]; then
              r3=true
              test "$(jq -er '.planned_product_base_commit' "$record")" \
                = "$(jq -er '.corrected_planned_product_base_commit' "$correction")"
              for field in \
                proof_helper_source_commit proof_helper_source_tree_sha256 \
                proof_helper_sha256 proof_helper_control_plane_sha256 \
                proof_helper_toolchain_sha256 proof_helper_rustflags_sha256 \
                proof_helper_build_target proof_helper_build_profile \
                proof_helper_build_clean proof_helper_execution_path \
                proof_helper_protocol_sha256; do
                test "$(jq -er --arg field "$field" '.[$field]' "$record")" \
                  = "$(jq -er --arg field "$field" '.[$field]' "$correction")"
              done
            fi
            jq -cS --argjson r3 "$r3" 'del(
              .schema,
              .recovery_tool_sha256,
              .manifest_helper_sha256,
              .resolution_workflow_commit,
              .resolution_revision,
              .supersedes_resolution_tag,
              .supersedes_resolution_sha256,
              .superseded_recovery_tool_sha256,
              .correction_reason,
              .correction_review_sha256
            ) |
            if $r3 then del(
              .planned_product_base_commit,
              .proof_helper_source_commit,
              .proof_helper_source_tree_sha256,
              .proof_helper_sha256,
              .proof_helper_control_plane_sha256,
              .proof_helper_toolchain_sha256,
              .proof_helper_rustflags_sha256,
              .proof_helper_build_target,
              .proof_helper_build_profile,
              .proof_helper_build_clean,
              .proof_helper_execution_path,
              .proof_helper_protocol_sha256
            ) else . end' "$superseded_record" \
              >"$RUNNER_TEMP/superseded-resolution-tuple.json"
            jq -cS --argjson r3 "$r3" 'del(
              .schema,
              .recovery_tool_sha256,
              .manifest_helper_sha256,
              .resolution_workflow_commit,
              .resolution_revision,
              .supersedes_resolution_tag,
              .supersedes_resolution_sha256,
              .superseded_recovery_tool_sha256,
              .correction_reason,
              .correction_review_sha256
            ) |
            if $r3 then del(
              .planned_product_base_commit,
              .proof_helper_source_commit,
              .proof_helper_source_tree_sha256,
              .proof_helper_sha256,
              .proof_helper_control_plane_sha256,
              .proof_helper_toolchain_sha256,
              .proof_helper_rustflags_sha256,
              .proof_helper_build_target,
              .proof_helper_build_profile,
              .proof_helper_build_clean,
              .proof_helper_execution_path,
              .proof_helper_protocol_sha256
            ) else . end' "$record" \
              >"$RUNNER_TEMP/corrected-resolution-tuple.json"
            cmp "$RUNNER_TEMP/superseded-resolution-tuple.json" \
              "$RUNNER_TEMP/corrected-resolution-tuple.json"
          fi
          cosign verify-blob \
            --bundle "$resolution/release-authority-replacement-v1.json.cosign.bundle" \
            --certificate-identity \
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$resolution_workflow_commit" \
            "$record"
          chmod 0400 "$record" \
            "$resolution/release-authority-replacement-v1.json.cosign.bundle" \
            "$resolution/release-authority-selection-review-v1.json"
          chmod 0500 "$resolution/recover-release-authority-replacement-v1.sh" \
            "$resolution/release-authority-manifest.sh" "$resolution"

      - name: Upload recovered replacement resolution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovered-release-authority-resolution-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-resolution
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  recover_publish_resolution:
    needs:
      - predecessor
      - recover_sign_resolution
    if: needs.predecessor.outputs.target_already_published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-authority
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Checkout exact public recovery helpers
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Recheck policy before resolution recovery
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNTAUR_RELEASE_AUTHORITY_ADMIN_READ_TOKEN }}
        run: bash public-workflow/scripts/verify-release-authority-policy.sh

      - name: Download recovered replacement resolution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: recovered-release-authority-resolution-run-${{ github.run_id }}-attempt-*
          path: recovered-resolution-artifacts

      - name: Select recovered replacement resolution
        shell: bash
        run: |
          set -euo pipefail
          selected=$(find recovered-resolution-artifacts \
            -mindepth 1 -maxdepth 1 -type d \
            -name "recovered-release-authority-resolution-run-${GITHUB_RUN_ID}-attempt-*" \
            -printf '%f\n' | sort -V | sed -n '$p')
          if [[ -n $selected ]]; then
            test -z "$(find recovered-resolution-artifacts \
              -mindepth 1 -maxdepth 1 ! -type d -print -quit)"
            mv "recovered-resolution-artifacts/$selected" signed-resolution
          else
            test -z "$(find recovered-resolution-artifacts \
              -mindepth 1 -maxdepth 1 -type d -print -quit)"
            mv recovered-resolution-artifacts signed-resolution
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Publish or finish exact recovered replacement resolution
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNTAUR_RELEASE_AUTHORITY_PUBLISH_TOKEN }}
          GENERATION: ${{ needs.predecessor.outputs.generation }}
          TARGET_TAG: ${{ needs.predecessor.outputs.target_tag }}
          RESOLUTION_REVISION: ${{ inputs.resolution_revision }}
        run: |
          set -euo pipefail
          resolution_tag="authority-resolution-v1-g${GENERATION}"
          if [[ $RESOLUTION_REVISION != 1 ]]; then
            resolution_tag="${resolution_tag}-r${RESOLUTION_REVISION}"
          fi
          record=signed-resolution/release-authority-replacement-v1.json
          test "$(jq -er '.resolution_revision // 1' "$record")" \
            = "$RESOLUTION_REVISION"
          workflow_commit=$(jq -er '.resolution_workflow_commit' "$record")
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-replacement-resolution-assets signed-resolution
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-replacement-resolution-tag "$resolution_tag" "$record"
          cosign verify-blob \
            --bundle signed-resolution/release-authority-replacement-v1.json.cosign.bundle \
            --certificate-identity \
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$workflow_commit" \
            "$record"
          inventory="$RUNNER_TEMP/resolution-inventory.jsons"
          matches="$RUNNER_TEMP/resolution-matches.jsons"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[]' >"$inventory"
          jq -c --arg tag "$resolution_tag" \
            'select(.tag_name == $tag)' "$inventory" >"$matches"
          count=$(jq -s 'length' "$matches")
          (( count <= 1 )) || { printf 'duplicate resolution releases\n' >&2; exit 1; }
          if (( count == 0 )); then
            if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${resolution_tag}" \
              >"$RUNNER_TEMP/orphan-tag.json" 2>"$RUNNER_TEMP/orphan-tag.error"; then
              printf 'orphan replacement-resolution tag exists\n' >&2
              exit 1
            fi
            grep -Eq '\(HTTP 404\)$' "$RUNNER_TEMP/orphan-tag.error"
            release=$(gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$resolution_tag" \
              -f target_commitish="$workflow_commit" \
              -f name="Release authority replacement resolution G${GENERATION} R${RESOLUTION_REVISION}" \
              -f body="Signed resolution revision ${RESOLUTION_REVISION} selecting ${TARGET_TAG}; every prior resolution remains immutable." \
              -F draft=true -F prerelease=false -f make_latest=false)
          else
            release=$(jq -s '.[0]' "$matches")
          fi
          resolution_tag_present=false
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${resolution_tag}" \
            >"$RUNNER_TEMP/recovery-resolution-tag.json" \
            2>"$RUNNER_TEMP/recovery-resolution-tag.error"; then
            resolution_tag_present=true
            test "$(jq -r '.object.type' \
              "$RUNNER_TEMP/recovery-resolution-tag.json")" = commit
            test "$(jq -r '.object.sha' \
              "$RUNNER_TEMP/recovery-resolution-tag.json")" = "$workflow_commit"
          else
            grep -Eq '\(HTTP 404\)$' \
              "$RUNNER_TEMP/recovery-resolution-tag.error"
          fi
          if [[ $(jq -r '.draft' <<<"$release") == false ]]; then
            test "$resolution_tag_present" = true
          fi
          if [[ $(jq -r '.draft' <<<"$release") == true ]]; then
            release_id=$(jq -er '.id' <<<"$release")
            if [[ $(jq -r '.target_commitish' <<<"$release") != "$workflow_commit" ]]; then
              gh api --method PATCH \
                "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -f target_commitish="$workflow_commit" >/dev/null
              release=$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}")
            fi
            expected_assets=$(find signed-resolution -mindepth 1 -maxdepth 1 \
              -printf '%f\n' | LC_ALL=C sort)
            observed_assets=$(jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort)
            draft_matches=false
            if [[ $observed_assets == "$expected_assets" ]]; then
              proof="$RUNNER_TEMP/recovered-resolution-draft"
              mkdir -m 0700 "$proof"
              draft_matches=true
              while IFS=$'\t' read -r asset_id asset_name; do
                printf '%s' "$asset_name" | grep -Eq '^[A-Za-z0-9._-]+$'
                gh api -H 'Accept: application/octet-stream' \
                  "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                  >"$proof/$asset_name"
                if ! cmp -s "signed-resolution/$asset_name" "$proof/$asset_name"; then
                  draft_matches=false
                fi
              done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<<"$release")
            fi
            if [[ $draft_matches != true ]]; then
              while IFS= read -r asset_id; do
                gh api --method DELETE \
                  "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              done < <(jq -r '.assets[].id' <<<"$release")
              upload_assets=(
                signed-resolution/recover-release-authority-replacement-v1.sh
                signed-resolution/release-authority-manifest.sh
                signed-resolution/release-authority-selection-review-v1.json
                signed-resolution/release-authority-replacement-v1.json
                signed-resolution/release-authority-replacement-v1.json.cosign.bundle
              )
              if [[ -f signed-resolution/release-authority-resolution-correction-v1.json ]]; then
                upload_assets+=(signed-resolution/release-authority-resolution-correction-v1.json)
              fi
              gh release upload "$resolution_tag" "${upload_assets[@]}" \
                --repo "$GITHUB_REPOSITORY"
            fi
            release=$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}")
            observed_assets=$(jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort)
            test "$observed_assets" = "$expected_assets"
            gh api --method PATCH \
              "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false -F prerelease=false -f make_latest=false >/dev/null
          fi
          final=$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${resolution_tag}")
          test "$(jq -r '.draft' <<<"$final")" = false
          test "$(jq -r '.prerelease' <<<"$final")" = false
          test "$(jq -r '.immutable' <<<"$final")" = true
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${resolution_tag}" \
            --jq '.object.sha')" = "$workflow_commit"
          gh release verify "$resolution_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          while IFS= read -r asset; do
            gh release verify-asset "$resolution_tag" "signed-resolution/$asset" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
          done < <(find signed-resolution -mindepth 1 -maxdepth 1 -printf '%f\n')

  publish:
    needs:
      - predecessor
      - source_metadata
      - sign
    if: needs.predecessor.outputs.already_published != 'true' && needs.predecessor.outputs.target_already_published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-authority
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Checkout exact public verification helpers
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: public-workflow

      - name: Recheck policy before publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNTAUR_RELEASE_AUTHORITY_ADMIN_READ_TOKEN }}
        run: bash public-workflow/scripts/verify-release-authority-policy.sh

      - name: Download signed authority
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: signed-release-authority-run-${{ github.run_id }}-attempt-*
          path: signed-authority-artifacts

      - name: Select newest immutable signed package from this run
        shell: bash
        run: |
          set -euo pipefail
          selected=$(find signed-authority-artifacts \
            -mindepth 1 -maxdepth 1 -type d \
            -name "signed-release-authority-run-${GITHUB_RUN_ID}-attempt-*" \
            -printf '%f\n' | sort -V | sed -n '$p')
          if [[ -n $selected ]]; then
            test -z "$(find signed-authority-artifacts \
              -mindepth 1 -maxdepth 1 ! -type d -print -quit)"
            mv "signed-authority-artifacts/$selected" signed-authority
          else
            test -z "$(find signed-authority-artifacts \
              -mindepth 1 -maxdepth 1 -type d -print -quit)"
            mv signed-authority-artifacts signed-authority
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Reverify exact signed package without executing candidate
        shell: bash
        env:
          GENERATION: ${{ needs.predecessor.outputs.generation }}
          PREVIOUS_GENERATION: ${{ needs.predecessor.outputs.previous_generation }}
          PREVIOUS_MANIFEST_SHA256: ${{ needs.predecessor.outputs.previous_manifest_sha256 }}
          AUTHORITY_VERSION: ${{ fromJSON(inputs.approval_record).authority_version }}
          AUTHORITY_COMMIT: ${{ fromJSON(inputs.approval_record).authority_commit }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
          AUTHORITY_TREE_SHA256: ${{ needs.source_metadata.outputs.authority_tree_sha256 }}
          SHIPPER_SHA256: ${{ fromJSON(inputs.approval_record).shipper_sha256 }}
          VERIFIER_SHA256: ${{ fromJSON(inputs.approval_record).verifier_sha256 }}
          PROVISIONER_SHA256: ${{ fromJSON(inputs.approval_record).provisioner_sha256 }}
          PRODUCTION_CONTRACT_SHA256: ${{ fromJSON(inputs.approval_record).production_contract_sha256 }}
          PROMOTION_RECOVERY_SHA256: ${{ fromJSON(inputs.approval_record).promotion_recovery_sha256 }}
        run: |
          set -euo pipefail
          chmod 0500 signed-authority
          chmod 0400 \
            signed-authority/release-authority-v2.json \
            signed-authority/release-authority-v2.json.cosign.bundle
          chmod 0500 \
            signed-authority/syntaur-build-authority-provision \
            signed-authority/syntaur-ship-linux-x86_64 \
            signed-authority/syntaur-verify-linux-x86_64
          bash public-workflow/scripts/release-authority-manifest.sh \
            validate-stage-v2 signed-authority
          manifest=signed-authority/release-authority-v2.json
          test "$(jq -er '.generation' "$manifest")" = "$GENERATION"
          test "$(jq -er '.previous_generation' "$manifest")" = "$PREVIOUS_GENERATION"
          test "$(jq -er '.previous_manifest_sha256' "$manifest")" \
            = "$PREVIOUS_MANIFEST_SHA256"
          test "$(jq -er '.authority_version' "$manifest")" = "$AUTHORITY_VERSION"
          test "$(jq -er '.authority_commit' "$manifest")" = "$AUTHORITY_COMMIT"
          test "$(jq -er '.verification_policy_revision' "$manifest")" \
            = "$VERIFICATION_POLICY_REVISION"
          test "$(jq -er '.authority_tree_sha256' "$manifest")" = "$AUTHORITY_TREE_SHA256"
          test "$(jq -er '.shipper_sha256' "$manifest")" = "$SHIPPER_SHA256"
          test "$(jq -er '.verifier_sha256' "$manifest")" = "$VERIFIER_SHA256"
          test "$(jq -er '.provisioner_sha256' "$manifest")" = "$PROVISIONER_SHA256"
          test "$(jq -er '.production_contract_sha256' "$manifest")" \
            = "$PRODUCTION_CONTRACT_SHA256"
          test "$(jq -er '.promotion_recovery_sha256' "$manifest")" \
            = "$PROMOTION_RECOVERY_SHA256"
          test "$(jq -er '.workflow_commit' "$manifest")" = "$GITHUB_SHA"
          cosign verify-blob \
            --bundle signed-authority/release-authority-v2.json.cosign.bundle \
            --certificate-identity \
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-authority.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$manifest"

      - name: Recover draft and publish immutable exact successor
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNTAUR_RELEASE_AUTHORITY_PUBLISH_TOKEN }}
          GENERATION: ${{ needs.predecessor.outputs.generation }}
          PREVIOUS_GENERATION: ${{ needs.predecessor.outputs.previous_generation }}
          AUTHORITY_COMMIT: ${{ fromJSON(inputs.approval_record).authority_commit }}
          VERIFICATION_POLICY_REVISION: ${{ fromJSON(inputs.approval_record).verification_policy_revision }}
          TARGET_TAG: ${{ needs.predecessor.outputs.target_tag }}
        run: |
          set -euo pipefail
          api_optional() {
            local endpoint=$1
            local output=$2
            local error_file=$3
            if gh api "$endpoint" >"$output" 2>"$error_file"; then
              printf 'present\n'
              return
            fi
            if grep -Eq '\(HTTP 404\)$' "$error_file"; then
              : >"$output"
              printf 'absent\n'
              return
            fi
            cat "$error_file" >&2
            return 1
          }
          release_by_tag() {
            local inventory=$1
            local tag=$2
            local output=$3
            local matches count
            matches=$(mktemp "$RUNNER_TEMP/release-by-tag.XXXXXX") \
              || return 1
            jq -c --arg tag "$tag" \
              'select(.tag_name == $tag)' "$inventory" >"$matches" \
              || return 1
            count=$(jq -s 'length' "$matches") || return 1
            if (( count > 1 )); then
              printf 'duplicate release records for tag %s\n' "$tag" >&2
              return 1
            fi
            if [[ $count == 0 ]]; then
              : >"$output" || return 1
              printf 'absent\n'
            else
              jq -s '.[0]' "$matches" >"$output" || return 1
              printf 'present\n'
            fi
          }
          snapshot_authority_namespace() {
            local release_inventory=$1
            local require_current=$2
            local ref_inventory
            ref_inventory=$(mktemp \
              "$RUNNER_TEMP/authority-ref-inventory.XXXXXX")
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[]' >"$release_inventory" || return 1
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/authority-v1-g?per_page=100" \
              --jq '.[]' >"$ref_inventory" || return 1
            for inventory in "$release_inventory" "$ref_inventory"; do
              jq -e -s \
                --argjson previous "$PREVIOUS_GENERATION" \
                --argjson generation "$GENERATION" \
                --argjson require_current "$require_current" '
                  def exact_through($n):
                    (($n == 0) and (length == 0)) or
                    (($n > 0) and (length == $n) and (max == $n));
                  [
                    .[] |
                    (
                      .tag_name //
                      (.ref | sub("^refs/tags/"; ""))
                    ) |
                    select(startswith("authority-v1-g"))
                  ] as $tags |
                  all(
                    $tags[];
                    test("^authority-v1-g[1-9][0-9]*$")
                  ) and
                  (($tags | length) == ($tags | unique | length)) and
                  (
                    [
                      $tags[] |
                      capture("^authority-v1-g(?<n>[1-9][0-9]*)$").n |
                      tonumber
                    ] |
                    if $require_current then
                      exact_through($generation)
                    else
                      exact_through($previous) or
                      exact_through($generation)
                    end
                  )
                ' "$inventory" >/dev/null || return 1
            done
          }
          snapshot_authority_namespace_consistent() {
            local release_inventory=$1 attempt
            for attempt in {1..10}; do
              if snapshot_authority_namespace \
                "$release_inventory" true; then
                return
              fi
              if (( attempt < 10 )); then
                printf 'authority namespace has not converged after mutation; retry %s/10\n' \
                  "$attempt" >&2
                sleep 2
              fi
            done
            printf 'authority namespace did not converge after 10 checks\n' >&2
            return 1
          }

          tag=$TARGET_TAG
          test "$GENERATION" = "$((PREVIOUS_GENERATION + 1))"
          expected_assets=$(printf '%s\n' \
            release-authority-v2.json \
            release-authority-v2.json.cosign.bundle \
            syntaur-build-authority-provision \
            syntaur-ship-linux-x86_64 \
            syntaur-verify-linux-x86_64 | LC_ALL=C sort)

          tag_file="$RUNNER_TEMP/publish-tag.json"
          tag_error="$RUNNER_TEMP/publish-tag.error"
          tag_status=$(api_optional \
            "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            "$tag_file" "$tag_error")
          if [[ $tag_status == present ]]; then
            tag_ref=$(<"$tag_file")
            test "$(jq -r '.object.type' <<<"$tag_ref")" = commit
            test "$(jq -r '.object.sha' <<<"$tag_ref")" = "$GITHUB_SHA"
            tag_exists=true
          else
            tag_exists=false
          fi

          release_inventory="$RUNNER_TEMP/publish-release-inventory.jsons"
          snapshot_authority_namespace "$release_inventory" false
          release_file="$RUNNER_TEMP/publish-release.json"
          release_status=$(release_by_tag \
            "$release_inventory" "$tag" "$release_file")
          if [[ $release_status == present ]]; then
            release=$(<"$release_file")
            if [[ $(jq -r '.draft' <<<"$release") == false ]]; then
              test "$tag_exists" = true
              test "$(jq -r '.immutable' <<<"$release")" = true
            else
              test "$(jq -r '.prerelease' <<<"$release")" = false
              if [[ $tag_exists == false ]]; then
                test "$(jq -r '.target_commitish' <<<"$release")" = "$GITHUB_SHA"
              fi
            fi
          fi

          if [[ $tag_exists == false ]]; then
            tag_ref=$(gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$GITHUB_SHA")
            test "$(jq -r '.ref' <<<"$tag_ref")" = "refs/tags/${tag}"
            test "$(jq -r '.object.type' <<<"$tag_ref")" = commit
            test "$(jq -r '.object.sha' <<<"$tag_ref")" = "$GITHUB_SHA"
            tag_exists=true
          fi

          if [[ $release_status == absent ]]; then
            release=$(gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Syntaur release authority generation ${GENERATION}" \
              -f body="Evidence-approved frozen N-1 authority source ${AUTHORITY_COMMIT}. This trust artifact is independent of product releases and is immutable." \
              -F draft=true \
              -F prerelease=false \
              -f make_latest=false)
            test "$(jq -r '.tag_name' <<<"$release")" = "$tag"
            test "$(jq -r '.draft' <<<"$release")" = true
            test "$(jq -r '.prerelease' <<<"$release")" = false
          fi

          if [[ $(jq -r '.draft' <<<"$release") == true ]]; then
            actual_assets=$(jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort)
            while IFS= read -r existing; do
              [[ -z $existing ]] && continue
              grep -Fxq "$existing" <<<"$expected_assets"
            done <<<"$actual_assets"
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              signed-authority/release-authority-v2.json \
              signed-authority/release-authority-v2.json.cosign.bundle \
              signed-authority/syntaur-build-authority-provision \
              signed-authority/syntaur-ship-linux-x86_64 \
              signed-authority/syntaur-verify-linux-x86_64

            proof_dir="$RUNNER_TEMP/published-draft-proof"
            mkdir -m 0700 "$proof_dir"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" --dir "$proof_dir"
            actual_assets=$(find "$proof_dir" -mindepth 1 -maxdepth 1 \
              -type f -printf '%f\n' | LC_ALL=C sort)
            test "$actual_assets" = "$expected_assets"
            while IFS= read -r asset; do
              cmp "signed-authority/$asset" "$proof_dir/$asset"
            done <<<"$expected_assets"
            release_id=$(jq -er '.id' <<<"$release")
            prepublish_inventory="$RUNNER_TEMP/prepublish-release-inventory.jsons"
            snapshot_authority_namespace_consistent "$prepublish_inventory"
            prepublish_file="$RUNNER_TEMP/prepublish-release.json"
            test "$(release_by_tag \
              "$prepublish_inventory" "$tag" "$prepublish_file")" = present
            test "$(jq -er '.id' "$prepublish_file")" = "$release_id"
            test "$(jq -r '.draft' "$prepublish_file")" = true
            test "$(jq -r '.prerelease' "$prepublish_file")" = false
            test "$(gh api \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              --jq '.object.type')" = commit
            test "$(gh api \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              --jq '.object.sha')" = "$GITHUB_SHA"
            current_draft=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/${release_id}")
            test "$(jq -er '.id' <<<"$current_draft")" = "$release_id"
            test "$(jq -r '.tag_name' <<<"$current_draft")" = "$tag"
            test "$(jq -r '.target_commitish' <<<"$current_draft")" \
              = "$GITHUB_SHA"
            test "$(jq -r '.draft' <<<"$current_draft")" = true
            test "$(jq -r '.prerelease' <<<"$current_draft")" = false
            actual_assets=$(jq -r '.assets[].name' <<<"$current_draft" \
              | LC_ALL=C sort)
            test "$actual_assets" = "$expected_assets"
            while IFS= read -r asset; do
              asset_sha256=$(sha256sum "signed-authority/$asset" \
                | awk '{print $1}')
              asset_size=$(stat -c '%s' "signed-authority/$asset")
              jq -e \
                --arg name "$asset" \
                --arg digest "sha256:${asset_sha256}" \
                --argjson size "$asset_size" '
                  [.assets[] | select(.name == $name)] as $assets |
                  ($assets | length) == 1 and
                  $assets[0].state == "uploaded" and
                  $assets[0].digest == $digest and
                  $assets[0].size == $size
                ' <<<"$current_draft" >/dev/null
            done <<<"$expected_assets"
            gh api --method PATCH \
              "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=false >/dev/null
          fi

          test "$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            --jq '.object.type')" = commit
          test "$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            --jq '.object.sha')" = "$GITHUB_SHA"
          release=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
          test "$(jq -r '.draft' <<<"$release")" = false
          test "$(jq -r '.prerelease' <<<"$release")" = false
          test "$(jq -r '.immutable' <<<"$release")" = true
          actual_assets=$(jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort)
          test "$actual_assets" = "$expected_assets"
          gh release verify "$tag" \
            --repo "$GITHUB_REPOSITORY" >/dev/null
          while IFS= read -r asset; do
            gh release verify-asset "$tag" "signed-authority/$asset" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
          done <<<"$expected_assets"
          test "$(gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" \
            != "$tag"
